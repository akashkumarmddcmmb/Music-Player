name: Android CI, GitHub Release & Google Play Bundle

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_github_release:
        description: "Publish a GitHub Release with APK, AAB & SHA-256 checksums"
        required: false
        default: true
        type: boolean
      release_tag:
        description: "Release version tag (e.g., v1.0.1) when triggered manually"
        required: false
        default: "v1.0.1"
        type: string
      prerelease:
        description: "Mark GitHub release as pre-release"
        required: false
        default: false
        type: boolean
      build_play_bundle:
        description: "Build signed Google Play Android App Bundle (:app:bundleRelease)"
        required: false
        default: true
        type: boolean
      publish_to_play_store:
        description: "Upload signed AAB to Google Play Console (requires GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret)"
        required: false
        default: false
        type: boolean
      play_track:
        description: "Google Play release track (internal/alpha/beta recommended before production)"
        required: false
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      file_manager_apk_url:
        description: "Optional File Manager APK direct URL for informational signing certificate comparison"
        required: false
        default: ""
        type: string

# Least-privilege default permissions for all jobs (including pull_request)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_CERT_SHA256: "39:11:67:E3:46:A0:50:E1:1E:74:56:28:37:CD:2E:AB:C5:09:E2:39:A5:91:40:D9:74:42:6C:49:64:F8:88:C7"

jobs:
  build-verify-and-release:
    name: Test, Lint, Build Signed APK/AAB & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    outputs:
      release_tag: ${{ steps.version_meta.outputs.release_tag }}
      version_name: ${{ steps.version_meta.outputs.version_name }}
      version_code: ${{ steps.version_meta.outputs.version_code }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Resolve Monotonic Version Metadata Across Channels
        id: version_meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            RAW_TAG="${{ inputs.release_tag }}"
          else
            RAW_TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          # Monotonically increasing versionCode across GitHub Releases and Google Play tracks
          MONOTONIC_CODE=$(( 100 + ${GITHUB_RUN_NUMBER:-1} ))
          echo "release_tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${MONOTONIC_CODE}" >> "$GITHUB_OUTPUT"

      - name: Ensure Gradle Wrapper is Executable
        run: chmod +x gradlew

      - name: Execute Unit & Robolectric Tests
        env:
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Execute Android Lint Verification
        env:
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Build Debug APK (AGP Default Debug Signing)
        env:
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::assembleDebug failed to produce app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

      - name: Notice for Untrusted Pull Requests (No Release Signing Secrets Exposed)
        if: github.event_name == 'pull_request'
        run: |
          echo "============================================================"
          echo "  Pull Request Verification Complete (Tests, Lint & Debug APK Passed)"
          echo "  Note: GitHub Actions does not expose release signing secrets"
          echo "  (UPLOAD_KEY_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
          echo "  to pull_request runs. Release APK/AAB signing is skipped on PRs."
          echo "============================================================"

      - name: Decode & Verify Original Upload Keystore from UPLOAD_KEY_BASE64
        id: load_keystore
        if: github.event_name != 'pull_request'
        env:
          UPLOAD_KEY_BASE64: ${{ secrets.UPLOAD_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          # 1. Verify all 4 required signing secrets are present
          CLEAN_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n\t ')
          CLEAN_STORE_PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')

          MISSING_SECRETS=""
          [ -z "$UPLOAD_KEY_BASE64" ] && MISSING_SECRETS="${MISSING_SECRETS} UPLOAD_KEY_BASE64"
          [ -z "$CLEAN_STORE_PASS" ] && MISSING_SECRETS="${MISSING_SECRETS} KEYSTORE_PASSWORD"
          [ -z "$CLEAN_ALIAS" ] && MISSING_SECRETS="${MISSING_SECRETS} KEY_ALIAS"
          [ -z "$CLEAN_KEY_PASS" ] && MISSING_SECRETS="${MISSING_SECRETS} KEY_PASSWORD"

          if [ -n "$MISSING_SECRETS" ]; then
            echo "::error::Missing required repository signing secret(s):${MISSING_SECRETS}. Refusing to generate or substitute another certificate."
            exit 1
          fi

          # Helper: normalize & decode a Base64 string to a target file via GNU base64
          decode_b64_layer() {
            local RAW_INPUT="$1"
            local TARGET_OUT="$2"
            local ERR_FILE="$3"
            local NORM_B64
            # Strip PEM header/footer lines, data:...;base64, prefix, whitespace, and surrounding quotes
            NORM_B64=$(printf '%s' "$RAW_INPUT" | sed -E '/^-----BEGIN /d; /^-----END /d; s/^data:[^,]*base64,//I' | tr -d '\r\n\t "'"'" | tr -- '-_' '+/')
            if [ -z "$NORM_B64" ]; then
              return 1
            fi
            # Strip existing '=' padding and re-pad deterministically from unpadded length modulo 4
            NORM_B64=$(printf '%s' "$NORM_B64" | sed 's/=*$//')
            if ! printf '%s' "$NORM_B64" | grep -Eq '^[A-Za-z0-9+/]+$'; then
              return 1
            fi
            local REM=$(( ${#NORM_B64} % 4 ))
            if [ "$REM" -eq 2 ]; then
              echo "Restoring 2 missing '=' padding characters (unpadded length ${#NORM_B64}, remainder 2)..."
              NORM_B64="${NORM_B64}=="
            elif [ "$REM" -eq 3 ]; then
              echo "Restoring 1 missing '=' padding character (unpadded length ${#NORM_B64}, remainder 3)..."
              NORM_B64="${NORM_B64}="
            elif [ "$REM" -eq 1 ]; then
              echo "::error::Invalid Base64 length (${#NORM_B64}): length modulo 4 equals 1, which cannot represent valid binary data."
              return 1
            fi
            printf '%s' "$NORM_B64" | base64 --decode > "$TARGET_OUT" 2> "$ERR_FILE"
          }

          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          DECODE_LOG="${GITHUB_WORKSPACE}/base64_decode_err.log"

          echo "Decoding my-upload-key.jks from UPLOAD_KEY_BASE64..."
          if ! decode_b64_layer "$UPLOAD_KEY_BASE64" "$KEYSTORE_FILE" "$DECODE_LOG"; then
            DECODE_ERR=$(cat "$DECODE_LOG" 2>/dev/null)
            echo "::error::GNU base64 decoding failed for UPLOAD_KEY_BASE64: ${DECODE_ERR:-invalid Base64 input}"
            rm -f "$DECODE_LOG"
            exit 1
          fi
          rm -f "$DECODE_LOG"

          if [ ! -f "$KEYSTORE_FILE" ] || [ ! -r "$KEYSTORE_FILE" ] || [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded keystore file ($KEYSTORE_FILE) is missing, unreadable, or empty."
            exit 1
          fi

          # Check magic header; automatically unwrap nested Base64 or hex layers if the secret was double-encoded
          # (e.g., ~2086-byte JKS -> 2782-byte Base64 text -> 3710-char Base64 secret)
          for PASS in 1 2 3; do
            MAGIC_HEX=$(head -c 4 "$KEYSTORE_FILE" | od -An -tx1 | tr -d ' \n' | tr '[:upper:]' '[:lower:]')
            FIRST_BYTE="${MAGIC_HEX:0:2}"
            FILE_BYTES=$(stat -c%s "$KEYSTORE_FILE")
            if [ "$MAGIC_HEX" = "feedfeed" ] || [ "$FIRST_BYTE" = "30" ]; then
              echo "Keystore binary header verified on pass ${PASS} (magic=0x${MAGIC_HEX}, binary size=${FILE_BYTES} bytes)."
              break
            fi

            TEXT_CANDIDATE=$(tr -d '\r\n\t "'"'" < "$KEYSTORE_FILE")
            if printf '%s' "$TEXT_CANDIDATE" | grep -Eq '^(feedfeed|FEEDFEED|3082)[0-9A-Fa-f]+$' && [ $(( ${#TEXT_CANDIDATE} % 2 )) -eq 0 ]; then
              echo "Detected hex-encoded keystore layer on pass ${PASS} (${FILE_BYTES} bytes); converting hex to binary..."
              HEX_TMP="${KEYSTORE_FILE}.hex.bin"
              if python3 -c "import sys; open(sys.argv[2], 'wb').write(bytes.fromhex(open(sys.argv[1]).read().strip()))" "$KEYSTORE_FILE" "$HEX_TMP" 2>/dev/null && [ -s "$HEX_TMP" ]; then
                mv "$HEX_TMP" "$KEYSTORE_FILE"
                continue
              fi
              rm -f "$HEX_TMP"
            fi

            INNER_TMP="${KEYSTORE_FILE}.inner.bin"
            if decode_b64_layer "$TEXT_CANDIDATE" "$INNER_TMP" "$DECODE_LOG" && [ -s "$INNER_TMP" ]; then
              echo "Unwrapped nested Base64 layer on pass ${PASS} (${FILE_BYTES} bytes -> $(stat -c%s "$INNER_TMP") bytes)..."
              mv "$INNER_TMP" "$KEYSTORE_FILE"
              rm -f "$DECODE_LOG"
            else
              rm -f "$INNER_TMP" "$DECODE_LOG"
              break
            fi
          done

          # Verify JKS binary structure and repair truncated 20-byte JKS SHA-1 trailer if 1..20 trailing bytes were cut off
          export KEYSTORE_FILE CLEAN_STORE_PASS
          python3 - << 'PYEOF'
          import os, struct, hashlib

          ks_path = os.environ["KEYSTORE_FILE"]
          raw_pass = os.environ["CLEAN_STORE_PASS"]
          data = open(ks_path, "rb").read()
          if len(data) >= 12:
              magic, version, count = struct.unpack(">III", data[:12])
              if magic == 0xFEEDFEED and version in (1, 2) and 1 <= count <= 64:
                  pos = 12
                  ok = True
                  try:
                      for _ in range(count):
                          tag = struct.unpack(">I", data[pos:pos+4])[0]
                          pos += 4
                          alias_len = struct.unpack(">H", data[pos:pos+2])[0]
                          pos += 2 + alias_len + 8
                          if tag == 1:
                              key_len = struct.unpack(">I", data[pos:pos+4])[0]
                              pos += 4 + key_len
                              cert_count = struct.unpack(">I", data[pos:pos+4])[0]
                              pos += 4
                              for _ in range(cert_count):
                                  if version == 2:
                                      ctype_len = struct.unpack(">H", data[pos:pos+2])[0]
                                      pos += 2 + ctype_len
                                  clen = struct.unpack(">I", data[pos:pos+4])[0]
                                  pos += 4 + clen
                          elif tag == 2:
                              if version == 2:
                                  ctype_len = struct.unpack(">H", data[pos:pos+2])[0]
                                  pos += 2 + ctype_len
                              clen = struct.unpack(">I", data[pos:pos+4])[0]
                              pos += 4 + clen
                          else:
                              ok = False
                              break
                  except Exception:
                      ok = False

                  if ok and pos <= len(data):
                      body = data[:pos]
                      trailer = data[pos:]
                      if len(trailer) < 20:
                          pw = raw_pass.strip() if raw_pass.strip() else raw_pass
                          md = hashlib.sha1()
                          md.update(raw_pass.encode("utf-16-be"))
                          md.update(b"Mighty Aphrodite")
                          md.update(body)
                          digest = md.digest()
                          if not digest.startswith(trailer) and pw != raw_pass:
                              md2 = hashlib.sha1()
                              md2.update(pw.encode("utf-16-be"))
                              md2.update(b"Mighty Aphrodite")
                              md2.update(body)
                              digest = md2.digest()
                          open(ks_path, "wb").write(body + digest)
                          print(f"Restored truncated JKS 20-byte SHA-1 integrity trailer ({len(trailer)} -> 20 bytes; total {len(body) + 20} bytes).")
          PYEOF

          FILE_BYTES=$(stat -c%s "$KEYSTORE_FILE")
          echo "Decoded keystore exact binary size confirmed via stat: ${FILE_BYTES} bytes."

          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
          echo "keystore_loaded=true" >> "$GITHUB_OUTPUT"

      - name: Validate Keystore, Alias upload & Certificate SHA-256
        id: validate_keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -r "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Keystore file not found or unreadable at KEYSTORE_PATH ($KEYSTORE_PATH)."
            exit 1
          fi

          CLEAN_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n\t ')
          CLEAN_STORE_PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          TRIMMED_STORE_PASS=$(printf '%s' "$CLEAN_STORE_PASS" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')
          TRIMMED_KEY_PASS=$(printf '%s' "$CLEAN_KEY_PASS" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          export CLEAN_STORE_PASS TRIMMED_STORE_PASS CLEAN_KEY_PASS TRIMMED_KEY_PASS

          # 1. Verify alias is "upload"
          if [ "$CLEAN_ALIAS" != "upload" ]; then
            echo "::error::Invalid KEY_ALIAS ('$CLEAN_ALIAS'). Expected alias 'upload'."
            exit 1
          fi

          # 2. Verify decoded JKS file and store password with keytool (using -storepass:env to avoid CLI option parsing issues)
          echo "Verifying JKS keystore integrity and store password via keytool..."
          if ! KS_OUT=$(keytool -list -keystore "$KEYSTORE_PATH" -storepass:env CLEAN_STORE_PASS 2>&1); then
            if [ "$TRIMMED_STORE_PASS" != "$CLEAN_STORE_PASS" ] && [ -n "$TRIMMED_STORE_PASS" ] && KS_OUT_TRIM=$(keytool -list -keystore "$KEYSTORE_PATH" -storepass:env TRIMMED_STORE_PASS 2>&1); then
              CLEAN_STORE_PASS="$TRIMMED_STORE_PASS"
              export CLEAN_STORE_PASS
              KS_OUT="$KS_OUT_TRIM"
            else
              MAGIC_HEX=$(head -c 4 "$KEYSTORE_PATH" | od -An -tx1 | tr -d ' \n')
              FILE_BYTES=$(stat -c%s "$KEYSTORE_PATH")
              SAFE_ERR=$(printf '%s\n' "$KS_OUT" | head -n 3 | tr '\n' ' ')
              if echo "$KS_OUT" | grep -qi -E "password was incorrect|Password verification failed"; then
                echo "::error::KEYSTORE_PASSWORD validation failed: password was incorrect (keystore size=${FILE_BYTES} bytes, header=0x${MAGIC_HEX})."
              elif echo "$KS_OUT" | grep -qi -E "Invalid keystore format|Unrecognized keystore format|not a keystore"; then
                echo "::error::Keystore format validation failed: decoded file (size=${FILE_BYTES} bytes, header=0x${MAGIC_HEX}) is not a valid JKS/PKCS12 keystore (${SAFE_ERR})."
              else
                echo "::error::Keystore validation failed via keytool (size=${FILE_BYTES} bytes, header=0x${MAGIC_HEX}): ${SAFE_ERR}"
              fi
              exit 1
            fi
          fi

          # 3. Verify alias "upload", PrivateKeyEntry, and 2048-bit RSA key
          echo "Validating alias 'upload' and PrivateKeyEntry in my-upload-key.jks..."
          if ! CERT_INFO=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass:env CLEAN_STORE_PASS -alias "$CLEAN_ALIAS" 2>&1); then
            echo "::error::Alias '$CLEAN_ALIAS' was not found or could not be read in my-upload-key.jks."
            exit 1
          fi

          if ! echo "$CERT_INFO" | grep -q "PrivateKeyEntry"; then
            echo "::error::Alias '$CLEAN_ALIAS' is not a PrivateKeyEntry in my-upload-key.jks."
            exit 1
          fi

          if ! echo "$CERT_INFO" | grep -qi -E "2048-bit RSA|RSA.*2048"; then
            echo "::error::Alias '$CLEAN_ALIAS' does not contain the expected 2048-bit RSA key."
            exit 1
          fi

          # 4. Compare decoded certificate SHA-256 with the exact verified fingerprint
          ACTUAL_SHA256=$(echo "$CERT_INFO" | awk '/SHA256:/ {print $2; exit}' | tr '[:lower:]' '[:upper:]')
          if [ -z "$ACTUAL_SHA256" ]; then
            echo "::error::Failed to extract certificate SHA-256 fingerprint for alias '$CLEAN_ALIAS'."
            exit 1
          fi

          if [ "$ACTUAL_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Certificate SHA-256 mismatch! Expected '$EXPECTED_CERT_SHA256', got '$ACTUAL_SHA256'."
            exit 1
          fi

          # 5. Verify store password and private key password through actual signing test
          echo "Verifying private key password (KEY_PASSWORD) for alias '$CLEAN_ALIAS'..."
          TEMP_JAR=$(mktemp /tmp/keypass_verify_XXXXXX.jar)
          jar cf "$TEMP_JAR" README.md
          if ! jarsigner -keystore "$KEYSTORE_PATH" -storepass:env CLEAN_STORE_PASS -keypass:env CLEAN_KEY_PASS "$TEMP_JAR" "$CLEAN_ALIAS" >/dev/null 2>&1; then
            if [ "$TRIMMED_KEY_PASS" != "$CLEAN_KEY_PASS" ] && [ -n "$TRIMMED_KEY_PASS" ] && jarsigner -keystore "$KEYSTORE_PATH" -storepass:env CLEAN_STORE_PASS -keypass:env TRIMMED_KEY_PASS "$TEMP_JAR" "$CLEAN_ALIAS" >/dev/null 2>&1; then
              CLEAN_KEY_PASS="$TRIMMED_KEY_PASS"
              export CLEAN_KEY_PASS
            elif jarsigner -keystore "$KEYSTORE_PATH" -storepass:env CLEAN_STORE_PASS -keypass:env CLEAN_STORE_PASS "$TEMP_JAR" "$CLEAN_ALIAS" >/dev/null 2>&1; then
              CLEAN_KEY_PASS="$CLEAN_STORE_PASS"
              export CLEAN_KEY_PASS
            else
              rm -f "$TEMP_JAR"
              echo "::error::Private key password (KEY_PASSWORD) verification failed for alias '$CLEAN_ALIAS'."
              exit 1
            fi
          fi
          rm -f "$TEMP_JAR"

          echo "============================================================"
          echo "  Verified Upload Keystore Certificate Summary"
          echo "============================================================"
          echo "$CERT_INFO" | grep -E "Keystore type:|Alias name:|Entry type:|Owner:|Issuer:|Valid from:|SHA1:|SHA256:|Signature algorithm name:|Subject Public Key Algorithm:" || true
          echo "============================================================"
          echo "expected_sha256=${ACTUAL_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Build Signed Release APK Using Verified Upload Keystore
        id: release_signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +x
          ./gradlew :app:assembleRelease --no-daemon
          if [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "::error::assembleRelease failed to produce app/build/outputs/apk/release/app-release.apk"
            exit 1
          fi
          echo "signed_release_built=true" >> "$GITHUB_OUTPUT"

      - name: Build Signed Release AAB Using Verified Upload Keystore
        id: bundle_signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +x
          ./gradlew :app:bundleRelease --no-daemon
          if [ ! -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "::error::bundleRelease failed to produce app/build/outputs/bundle/release/app-release.aab"
            exit 1
          fi
          echo "signed_bundle_built=true" >> "$GITHUB_OUTPUT"

      - name: Prepare Release Assets & SHA-256 Checksums
        id: prepare_assets
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release-assets
          VER="${{ steps.version_meta.outputs.version_name }}"
          CODE="${{ steps.version_meta.outputs.version_code }}"
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/PulsePlay-v${VER}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/PulsePlay-v${VER}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-assets/PulsePlay-v${VER}-vc${CODE}-release.aab"
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify Debug APK, Release APK & Release AAB Signing Certificates
        id: verify_apk_cert
        if: github.event_name != 'pull_request'
        env:
          FILE_MANAGER_APK_URL: ${{ inputs.file_manager_apk_url }}
        run: |
          set +x
          # 1. Dynamically resolve apksigner & aapt2 from Android SDK Build Tools on Ubuntu Runner
          resolve_build_tool() {
            local TOOL_NAME="$1"
            local FOUND_PATH=""
            if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
              FOUND_PATH=$(find "$ANDROID_HOME/build-tools" -name "$TOOL_NAME" -type f 2>/dev/null | sort -V | tail -n 1)
            fi
            if [ -z "$FOUND_PATH" ] && [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT/build-tools" ]; then
              FOUND_PATH=$(find "$ANDROID_SDK_ROOT/build-tools" -name "$TOOL_NAME" -type f 2>/dev/null | sort -V | tail -n 1)
            fi
            if [ -z "$FOUND_PATH" ]; then
              FOUND_PATH=$(find /usr/local/lib/android/sdk/build-tools /opt/android/sdk/build-tools -name "$TOOL_NAME" -type f 2>/dev/null | sort -V | tail -n 1)
            fi
            if [ -z "$FOUND_PATH" ] && command -v "$TOOL_NAME" >/dev/null 2>&1; then
              FOUND_PATH=$(command -v "$TOOL_NAME")
            fi
            printf '%s' "$FOUND_PATH"
          }

          APKSIGNER=$(resolve_build_tool "apksigner")
          AAPT2=$(resolve_build_tool "aapt2")

          # Ensure Android SDK Build Tools are installed if not yet present on runner
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
              echo "Installing Android SDK build-tools via sdkmanager..."
              yes | "$SDKMANAGER" "build-tools;35.0.0" >/dev/null 2>&1 || true
              APKSIGNER=$(resolve_build_tool "apksigner")
              AAPT2=$(resolve_build_tool "aapt2")
            fi
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::Android SDK apksigner not found in SDK Build Tools."
            exit 1
          fi

          echo "Resolved Android SDK apksigner: $APKSIGNER"
          [ -n "$AAPT2" ] && echo "Resolved Android SDK aapt2:     $AAPT2"

          # Helper to convert 64-char hex digest to uppercase colon-separated SHA-256
          format_colon_sha256() {
            local RAW_HEX
            RAW_HEX=$(printf '%s' "$1" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            if [ "${#RAW_HEX}" -eq 64 ]; then
              printf '%s' "$RAW_HEX" | sed 's/../&:/g; s/:$//'
            else
              printf '%s' "$1"
            fi
          }

          # Helper to extract Package ID from an APK via Android SDK aapt2
          extract_package_id() {
            local APK_PATH="$1"
            local DEFAULT_PKG="$2"
            local PKG=""
            if [ -n "$AAPT2" ] && [ -x "$AAPT2" ] && [ -f "$APK_PATH" ]; then
              PKG=$("$AAPT2" dump packagename "$APK_PATH" 2>/dev/null | tr -d '\r\n\t ')
            fi
            if [ -z "$PKG" ]; then
              PKG="$DEFAULT_PKG"
            fi
            printf '%s' "$PKG"
          }

          VER="${{ steps.version_meta.outputs.version_name }}"
          CODE="${{ steps.version_meta.outputs.version_code }}"
          DEBUG_APK="release-assets/PulsePlay-v${VER}-debug.apk"
          RELEASE_APK="release-assets/PulsePlay-v${VER}-release.apk"
          RELEASE_AAB="release-assets/PulsePlay-v${VER}-vc${CODE}-release.aab"
          EXPECTED_SHA256="${EXPECTED_CERT_SHA256}"
          EXPECTED_SHA256_HEX=$(printf '%s' "$EXPECTED_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')

          OVERALL_FAILURE=0

          # ------------------------------------------------------------------
          # 2. Verify Debug APK (Standard Android Debug Certificate allowed)
          # ------------------------------------------------------------------
          DEBUG_APK_NAME=$(basename "$DEBUG_APK")
          DEBUG_PKG_ID="com.aistudio.pulseplay.mpxvqr"
          DEBUG_SIGNER_COLON="N/A"
          DEBUG_STATUS="FAIL"

          if [ -f "$DEBUG_APK" ]; then
            DEBUG_PKG_ID=$(extract_package_id "$DEBUG_APK" "com.aistudio.pulseplay.mpxvqr")
            DEBUG_FILESIZE=$(stat -c%s "$DEBUG_APK")
            echo "============================================================"
            echo "  Verifying Debug APK Signature: $DEBUG_APK_NAME ($DEBUG_FILESIZE bytes)"
            echo "  Package ID: $DEBUG_PKG_ID"
            echo "------------------------------------------------------------"
            if DEBUG_CERT_OUT=$("$APKSIGNER" verify --print-certs -v "$DEBUG_APK" 2>&1); then
              echo "$DEBUG_CERT_OUT"
              DEBUG_RAW_HEX=$(printf '%s\n' "$DEBUG_CERT_OUT" | awk '/certificate SHA-256 digest:/ {print $NF; exit}')
              DEBUG_SIGNER_COLON=$(format_colon_sha256 "$DEBUG_RAW_HEX")
              DEBUG_STATUS="PASS"
            else
              echo "$DEBUG_CERT_OUT"
              echo "::error::Debug APK signature verification failed for $DEBUG_APK_NAME."
              OVERALL_FAILURE=1
            fi
            echo "============================================================"
          else
            echo "::error::Expected Debug APK $DEBUG_APK not found for signature verification."
            OVERALL_FAILURE=1
          fi

          # ------------------------------------------------------------------
          # 3. Verify Release APK against Official Music Player Upload Certificate
          # ------------------------------------------------------------------
          RELEASE_APK_NAME=$(basename "$RELEASE_APK")
          RELEASE_PKG_ID="com.aistudio.pulseplay.mpxvqr"
          RELEASE_SIGNER_COLON="N/A"
          RELEASE_APK_STATUS="FAIL"

          if [ -f "$RELEASE_APK" ]; then
            RELEASE_PKG_ID=$(extract_package_id "$RELEASE_APK" "com.aistudio.pulseplay.mpxvqr")
            RELEASE_FILESIZE=$(stat -c%s "$RELEASE_APK")
            echo "============================================================"
            echo "  Verifying Release APK Signature: $RELEASE_APK_NAME ($RELEASE_FILESIZE bytes)"
            echo "  Package ID: $RELEASE_PKG_ID"
            echo "------------------------------------------------------------"
            if RELEASE_CERT_OUT=$("$APKSIGNER" verify --print-certs -v "$RELEASE_APK" 2>&1); then
              echo "$RELEASE_CERT_OUT"
              RELEASE_CERT_SHA256=$(printf '%s\n' "$RELEASE_CERT_OUT" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]')
              RELEASE_SIGNER_COLON=$(format_colon_sha256 "$RELEASE_CERT_SHA256")
              echo "Release APK Signer SHA-256:   $RELEASE_SIGNER_COLON"
              echo "Expected Upload Key SHA-256:  $EXPECTED_SHA256"
              if [ -n "$RELEASE_CERT_SHA256" ] && [ "$RELEASE_CERT_SHA256" = "$EXPECTED_SHA256_HEX" ]; then
                RELEASE_APK_STATUS="PASS"
              else
                echo "::error::Release APK certificate ($RELEASE_SIGNER_COLON) does not match expected upload certificate ($EXPECTED_SHA256)."
                RELEASE_APK_STATUS="FAIL"
                OVERALL_FAILURE=1
              fi
            else
              echo "$RELEASE_CERT_OUT"
              echo "::error::apksigner verification failed for Release APK $RELEASE_APK_NAME."
              RELEASE_APK_STATUS="FAIL"
              OVERALL_FAILURE=1
            fi
            echo "============================================================"
          else
            echo "::error::Expected Release APK $RELEASE_APK not found for signature verification."
            OVERALL_FAILURE=1
          fi

          # ------------------------------------------------------------------
          # 4. Verify Release AAB against Official Music Player Upload Certificate
          # ------------------------------------------------------------------
          RELEASE_AAB_NAME=$(basename "$RELEASE_AAB")
          AAB_SHA256="N/A"
          RELEASE_AAB_STATUS="FAIL"

          if [ -f "$RELEASE_AAB" ]; then
            AAB_FILESIZE=$(stat -c%s "$RELEASE_AAB")
            if jarsigner -verify -verbose -certs "$RELEASE_AAB" >/dev/null 2>&1; then
              AAB_CERT_INFO=$(keytool -printcert -jarfile "$RELEASE_AAB" 2>/dev/null)
              AAB_SHA256=$(printf '%s\n' "$AAB_CERT_INFO" | awk '/SHA256:/ {print $2; exit}' | tr '[:lower:]' '[:upper:]')
              AAB_SHA256_HEX=$(printf '%s' "$AAB_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
              echo "============================================================"
              echo "  Verifying Release AAB Signature: $RELEASE_AAB_NAME ($AAB_FILESIZE bytes)"
              echo "  AAB Certificate SHA-256: $AAB_SHA256"
              echo "  Expected Upload SHA-256: $EXPECTED_SHA256"
              echo "============================================================"
              if [ -n "$AAB_SHA256_HEX" ] && [ "$AAB_SHA256_HEX" = "$EXPECTED_SHA256_HEX" ]; then
                RELEASE_AAB_STATUS="PASS"
              else
                echo "::error::Release AAB certificate ($AAB_SHA256) does not match expected upload certificate ($EXPECTED_SHA256)."
                RELEASE_AAB_STATUS="FAIL"
                OVERALL_FAILURE=1
              fi
            else
              echo "::error::jarsigner verification failed for $RELEASE_AAB_NAME."
              RELEASE_AAB_STATUS="FAIL"
              OVERALL_FAILURE=1
            fi
          else
            echo "::error::Expected Release AAB $RELEASE_AAB not found for signature verification."
            OVERALL_FAILURE=1
          fi

          # ------------------------------------------------------------------
          # 5. Informational File Manager APK Certificate Check (Non-Blocking)
          # ------------------------------------------------------------------
          FM_APK_PATH=""
          if [ -n "$FILE_MANAGER_APK_URL" ]; then
            echo "Downloading File Manager APK from provided URL for informational certificate comparison..."
            if curl -fsSL -L "$FILE_MANAGER_APK_URL" -o "/tmp/FileManager-compare.apk" 2>/dev/null && [ -s "/tmp/FileManager-compare.apk" ]; then
              FM_APK_PATH="/tmp/FileManager-compare.apk"
            else
              echo "::warning::Could not download File Manager APK from URL ($FILE_MANAGER_APK_URL). Continuing without failing Music Player workflow."
            fi
          fi

          if [ -z "$FM_APK_PATH" ]; then
            FM_APK_PATH=$(find "${GITHUB_WORKSPACE}" -maxdepth 3 -type f \( -iname "*file*manager*.apk" -o -iname "*filemanager*.apk" \) 2>/dev/null | head -n 1)
          fi

          FM_FOUND="false"
          FM_FILENAME="Not provided in this run"
          FM_PKG_ID="Separate File Manager App Package"
          FM_SIGNER_SHA256="N/A (Provide file_manager_apk_url or place FileManager.apk in workspace to inspect)"
          FM_COMPARISON_RESULT="INFO ONLY (Not Provided)"

          if [ -n "$FM_APK_PATH" ] && [ -f "$FM_APK_PATH" ]; then
            FM_FOUND="true"
            FM_FILENAME=$(basename "$FM_APK_PATH")
            FM_PKG_ID=$(extract_package_id "$FM_APK_PATH" "unknown.filemanager.package")
            if FM_CERT_OUT=$("$APKSIGNER" verify --print-certs "$FM_APK_PATH" 2>&1); then
              FM_RAW_HEX=$(printf '%s\n' "$FM_CERT_OUT" | awk '/certificate SHA-256 digest:/ {print $NF; exit}')
              FM_SIGNER_SHA256=$(format_colon_sha256 "$FM_RAW_HEX")
              if [ "$FM_SIGNER_SHA256" = "$EXPECTED_SHA256" ]; then
                FM_COMPARISON_RESULT="SAME CERTIFICATE AS MUSIC PLAYER UPLOAD KEY"
              else
                FM_COMPARISON_RESULT="DIFFERENT CERTIFICATE FROM MUSIC PLAYER UPLOAD KEY (Expected for independent keystore)"
              fi
            else
              FM_SIGNER_SHA256="Invalid or Unsigned APK"
              FM_COMPARISON_RESULT="UNVERIFIED APK SIGNATURE (Informational)"
            fi
            echo "============================================================"
            echo "  File Manager APK Certificate Comparison (Informational Only)"
            echo "  APK Filename:            $FM_FILENAME"
            echo "  Package ID:              $FM_PKG_ID"
            echo "  File Manager SHA-256:    $FM_SIGNER_SHA256"
            echo "  Music Player SHA-256:    $EXPECTED_SHA256"
            echo "  Comparison Result:       $FM_COMPARISON_RESULT"
            echo "============================================================"
            rm -f "/tmp/FileManager-compare.apk"
          fi

          # ------------------------------------------------------------------
          # 6. Write Structured Verification Report to $GITHUB_STEP_SUMMARY
          # ------------------------------------------------------------------
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "## 🔐 Android APK & AAB Signing Certificate Verification Report"
              echo ""
              echo "- **Android SDK Build Tools \`apksigner\`**: \`${APKSIGNER}\`"
              echo "- **Music Player Official Upload Alias**: \`upload\`"
              echo "- **Expected Upload Certificate SHA-256**: \`${EXPECTED_SHA256}\`"
              echo "- **AAB Signing Verification Status**: **${RELEASE_AAB_STATUS}** (\`${RELEASE_AAB_NAME}\`)"
              echo ""
              echo "### 🎵 Music Player Build Variants (\`com.aistudio.pulseplay.mpxvqr\`)"
              echo ""
              echo "| APK / Bundle Filename | Package ID | Build Type | Signer SHA-256 | Expected SHA-256 | Verification |"
              echo "| :--- | :--- | :--- | :--- | :--- | :---: |"
              echo "| \`${DEBUG_APK_NAME}\` | \`${DEBUG_PKG_ID}\` | Debug APK (AGP Default Debug Key) | \`${DEBUG_SIGNER_COLON}\` | Standard Android Debug Cert (Allowed to differ from Release) | **${DEBUG_STATUS}** |"
              echo "| \`${RELEASE_APK_NAME}\` | \`${RELEASE_PKG_ID}\` | Release APK (\`alias: upload\`) | \`${RELEASE_SIGNER_COLON}\` | \`${EXPECTED_SHA256}\` | **${RELEASE_APK_STATUS}** |"
              echo "| \`${RELEASE_AAB_NAME}\` | \`${RELEASE_PKG_ID}\` | Release AAB (\`alias: upload\`) | \`${AAB_SHA256}\` | \`${EXPECTED_SHA256}\` | **${RELEASE_AAB_STATUS}** |"
              echo ""
              echo "### 📁 File Manager APK Certificate Comparison (Informational — Non-Blocking)"
              echo ""
              echo "| APK Filename | Package ID | File Manager Signer SHA-256 | Music Player Upload SHA-256 | Certificate Comparison |"
              echo "| :--- | :--- | :--- | :--- | :--- |"
              echo "| \`${FM_FILENAME}\` | \`${FM_PKG_ID}\` | \`${FM_SIGNER_SHA256}\` | \`${EXPECTED_SHA256}\` | **${FM_COMPARISON_RESULT}** |"
              echo ""
              echo "> **Note:** Debug APK uses Android Gradle Plugin's standard debug certificate, whereas Release APK and Release AAB strictly require the verified Music Player upload certificate (\`${EXPECTED_SHA256}\`). File Manager APK comparison is purely informational and never blocks the Music Player build."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$OVERALL_FAILURE" -ne 0 ]; then
            echo "::error::Signing certificate verification failed! Check the GitHub Actions Step Summary for full details."
            exit 1
          fi

          echo "Signing verification passed: Debug APK is valid debug-signed; Release APK and Release AAB match the official upload certificate ($EXPECTED_SHA256)."


      - name: Upload Build Artifacts (Workflow Run)
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pulseplay-apk-artifacts-v${{ steps.version_meta.outputs.version_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Upload Diagnostic Test & Lint Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pulseplay-failure-diagnostics-${{ github.run_number }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Publish GitHub Release
        if: >
          success() &&
          github.event_name != 'pull_request' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.create_github_release != false))
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version_meta.outputs.release_tag }}
          name: "PulsePlay ${{ steps.version_meta.outputs.release_tag }}"
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ### PulsePlay ${{ steps.version_meta.outputs.release_tag }}
            - **versionName**: `${{ steps.version_meta.outputs.version_name }}`
            - **versionCode**: `${{ steps.version_meta.outputs.version_code }}`
            - **Release Signing Certificate SHA-256**: `${{ steps.validate_keystore.outputs.expected_sha256 }}`
            - `PulsePlay-v${{ steps.version_meta.outputs.version_name }}-release.apk` and `PulsePlay-v${{ steps.version_meta.outputs.version_name }}-vc${{ steps.version_meta.outputs.version_code }}-release.aab` are signed with the verified upload keystore (`alias: upload`).
            - `PulsePlay-v${{ steps.version_meta.outputs.version_name }}-debug.apk` uses standard Android debug signing.
            - Verify downloaded assets against `SHA256SUMS.txt` or via the in-app **Settings → App Updates** updater.
          files: |
            release-assets/*

      - name: Clean Up Decoded Upload Keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"

  google-play-bundle:
    name: Google Play Store Bundle & Track Deployment (Manual / Guarded)
    needs: build-verify-and-release
    if: >
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.build_play_bundle == true || inputs.publish_to_play_store == true)))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode & Verify Original Upload Keystore from UPLOAD_KEY_BASE64
        id: load_play_keystore
        env:
          UPLOAD_KEY_BASE64: ${{ secrets.UPLOAD_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          # 1. Verify all 4 required signing secrets are present
          CLEAN_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n\t ')
          CLEAN_STORE_PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')

          MISSING_SECRETS=""
          [ -z "$UPLOAD_KEY_BASE64" ] && MISSING_SECRETS="${MISSING_SECRETS} UPLOAD_KEY_BASE64"
          [ -z "$CLEAN_STORE_PASS" ] && MISSING_SECRETS="${MISSING_SECRETS} KEYSTORE_PASSWORD"
          [ -z "$CLEAN_ALIAS" ] && MISSING_SECRETS="${MISSING_SECRETS} KEY_ALIAS"
          [ -z "$CLEAN_KEY_PASS" ] && MISSING_SECRETS="${MISSING_SECRETS} KEY_PASSWORD"

          if [ -n "$MISSING_SECRETS" ]; then
            echo "::error::Google Play App Bundles require repository signing secrets:${MISSING_SECRETS}. Refusing to generate or substitute another certificate."
            exit 1
          fi

          decode_b64_layer() {
            local RAW_INPUT="$1"
            local TARGET_OUT="$2"
            local ERR_FILE="$3"
            local NORM_B64
            NORM_B64=$(printf '%s' "$RAW_INPUT" | sed -E '/^-----BEGIN /d; /^-----END /d; s/^data:[^,]*base64,//I' | tr -d '\r\n\t "'"'" | tr -- '-_' '+/')
            if [ -z "$NORM_B64" ]; then
              return 1
            fi
            NORM_B64=$(printf '%s' "$NORM_B64" | sed 's/=*$//')
            if ! printf '%s' "$NORM_B64" | grep -Eq '^[A-Za-z0-9+/]+$'; then
              return 1
            fi
            local REM=$(( ${#NORM_B64} % 4 ))
            if [ "$REM" -eq 2 ]; then
              echo "Restoring 2 missing '=' padding characters for Google Play bundle (unpadded length ${#NORM_B64}, remainder 2)..."
              NORM_B64="${NORM_B64}=="
            elif [ "$REM" -eq 3 ]; then
              echo "Restoring 1 missing '=' padding character for Google Play bundle (unpadded length ${#NORM_B64}, remainder 3)..."
              NORM_B64="${NORM_B64}="
            elif [ "$REM" -eq 1 ]; then
              echo "::error::Invalid Base64 length (${#NORM_B64}): length modulo 4 equals 1, which cannot represent valid binary data."
              return 1
            fi
            printf '%s' "$NORM_B64" | base64 --decode > "$TARGET_OUT" 2> "$ERR_FILE"
          }

          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          DECODE_LOG="${GITHUB_WORKSPACE}/play_base64_decode_err.log"

          echo "Decoding my-upload-key.jks from UPLOAD_KEY_BASE64 for Google Play bundle..."
          if ! decode_b64_layer "$UPLOAD_KEY_BASE64" "$KEYSTORE_FILE" "$DECODE_LOG"; then
            DECODE_ERR=$(cat "$DECODE_LOG" 2>/dev/null)
            echo "::error::GNU base64 decoding failed: ${DECODE_ERR:-base64: invalid input}"
            rm -f "$DECODE_LOG"
            exit 1
          fi
          rm -f "$DECODE_LOG"

          if [ ! -f "$KEYSTORE_FILE" ] || [ ! -r "$KEYSTORE_FILE" ] || [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded keystore file ($KEYSTORE_FILE) is missing, unreadable, or empty."
            exit 1
          fi

          for PASS in 1 2 3; do
            MAGIC_HEX=$(head -c 4 "$KEYSTORE_FILE" | od -An -tx1 | tr -d ' \n' | tr '[:upper:]' '[:lower:]')
            FIRST_BYTE="${MAGIC_HEX:0:2}"
            FILE_BYTES=$(stat -c%s "$KEYSTORE_FILE")
            if [ "$MAGIC_HEX" = "feedfeed" ] || [ "$FIRST_BYTE" = "30" ]; then
              echo "Keystore binary header verified on pass ${PASS} (magic=0x${MAGIC_HEX}, binary size=${FILE_BYTES} bytes)."
              break
            fi

            TEXT_CANDIDATE=$(tr -d '\r\n\t "'"'" < "$KEYSTORE_FILE")
            if printf '%s' "$TEXT_CANDIDATE" | grep -Eq '^(feedfeed|FEEDFEED|3082)[0-9A-Fa-f]+$' && [ $(( ${#TEXT_CANDIDATE} % 2 )) -eq 0 ]; then
              HEX_TMP="${KEYSTORE_FILE}.hex.bin"
              if python3 -c "import sys; open(sys.argv[2], 'wb').write(bytes.fromhex(open(sys.argv[1]).read().strip()))" "$KEYSTORE_FILE" "$HEX_TMP" 2>/dev/null && [ -s "$HEX_TMP" ]; then
                mv "$HEX_TMP" "$KEYSTORE_FILE"
                continue
              fi
              rm -f "$HEX_TMP"
            fi

            INNER_TMP="${KEYSTORE_FILE}.inner.bin"
            if decode_b64_layer "$TEXT_CANDIDATE" "$INNER_TMP" "$DECODE_LOG" && [ -s "$INNER_TMP" ]; then
              echo "Unwrapped nested Base64 layer on pass ${PASS} (${FILE_BYTES} bytes -> $(stat -c%s "$INNER_TMP") bytes)..."
              mv "$INNER_TMP" "$KEYSTORE_FILE"
              rm -f "$DECODE_LOG"
            else
              rm -f "$INNER_TMP" "$DECODE_LOG"
              break
            fi
          done

          export KEYSTORE_FILE CLEAN_STORE_PASS
          python3 - << 'PYEOF'
          import os, struct, hashlib

          ks_path = os.environ["KEYSTORE_FILE"]
          raw_pass = os.environ["CLEAN_STORE_PASS"]
          data = open(ks_path, "rb").read()
          if len(data) >= 12:
              magic, version, count = struct.unpack(">III", data[:12])
              if magic == 0xFEEDFEED and version in (1, 2) and 1 <= count <= 64:
                  pos = 12
                  ok = True
                  try:
                      for _ in range(count):
                          tag = struct.unpack(">I", data[pos:pos+4])[0]
                          pos += 4
                          alias_len = struct.unpack(">H", data[pos:pos+2])[0]
                          pos += 2 + alias_len + 8
                          if tag == 1:
                              key_len = struct.unpack(">I", data[pos:pos+4])[0]
                              pos += 4 + key_len
                              cert_count = struct.unpack(">I", data[pos:pos+4])[0]
                              pos += 4
                              for _ in range(cert_count):
                                  if version == 2:
                                      ctype_len = struct.unpack(">H", data[pos:pos+2])[0]
                                      pos += 2 + ctype_len
                                  clen = struct.unpack(">I", data[pos:pos+4])[0]
                                  pos += 4 + clen
                          elif tag == 2:
                              if version == 2:
                                  ctype_len = struct.unpack(">H", data[pos:pos+2])[0]
                                  pos += 2 + ctype_len
                              clen = struct.unpack(">I", data[pos:pos+4])[0]
                              pos += 4 + clen
                          else:
                              ok = False
                              break
                  except Exception:
                      ok = False

                  if ok and pos <= len(data):
                      body = data[:pos]
                      trailer = data[pos:]
                      if len(trailer) < 20:
                          pw = raw_pass.strip() if raw_pass.strip() else raw_pass
                          md = hashlib.sha1()
                          md.update(raw_pass.encode("utf-16-be"))
                          md.update(b"Mighty Aphrodite")
                          md.update(body)
                          digest = md.digest()
                          if not digest.startswith(trailer) and pw != raw_pass:
                              md2 = hashlib.sha1()
                              md2.update(pw.encode("utf-16-be"))
                              md2.update(b"Mighty Aphrodite")
                              md2.update(body)
                              digest = md2.digest()
                          open(ks_path, "wb").write(body + digest)
                          print(f"Restored truncated JKS 20-byte SHA-1 integrity trailer ({len(trailer)} -> 20 bytes; total {len(body) + 20} bytes).")
          PYEOF

          FILE_BYTES=$(stat -c%s "$KEYSTORE_FILE")
          echo "Decoded keystore exact binary size confirmed via stat: ${FILE_BYTES} bytes."

          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
          echo "keystore_loaded=true" >> "$GITHUB_OUTPUT"

      - name: Validate Keystore, Alias upload & Certificate SHA-256
        id: validate_play_keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -r "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Keystore file not found or unreadable at KEYSTORE_PATH ($KEYSTORE_PATH)."
            exit 1
          fi

          CLEAN_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n\t ')
          CLEAN_STORE_PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          TRIMMED_STORE_PASS=$(printf '%s' "$CLEAN_STORE_PASS" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')
          TRIMMED_KEY_PASS=$(printf '%s' "$CLEAN_KEY_PASS" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          export CLEAN_STORE_PASS TRIMMED_STORE_PASS CLEAN_KEY_PASS TRIMMED_KEY_PASS

          # 1. Verify alias is "upload"
          if [ "$CLEAN_ALIAS" != "upload" ]; then
            echo "::error::Invalid KEY_ALIAS ('$CLEAN_ALIAS'). Expected alias 'upload'."
            exit 1
          fi

          # 2. Verify decoded JKS file and store password with keytool
          echo "Verifying JKS keystore integrity and store password via keytool..."
          if ! KS_OUT=$(keytool -list -keystore "$KEYSTORE_PATH" -storepass:env CLEAN_STORE_PASS 2>&1); then
            if [ "$TRIMMED_STORE_PASS" != "$CLEAN_STORE_PASS" ] && [ -n "$TRIMMED_STORE_PASS" ] && KS_OUT_TRIM=$(keytool -list -keystore "$KEYSTORE_PATH" -storepass:env TRIMMED_STORE_PASS 2>&1); then
              CLEAN_STORE_PASS="$TRIMMED_STORE_PASS"
              export CLEAN_STORE_PASS
              KS_OUT="$KS_OUT_TRIM"
            else
              MAGIC_HEX=$(head -c 4 "$KEYSTORE_PATH" | od -An -tx1 | tr -d ' \n')
              FILE_BYTES=$(stat -c%s "$KEYSTORE_PATH")
              SAFE_ERR=$(printf '%s\n' "$KS_OUT" | head -n 3 | tr '\n' ' ')
              if echo "$KS_OUT" | grep -qi -E "password was incorrect|Password verification failed"; then
                echo "::error::KEYSTORE_PASSWORD validation failed: password was incorrect (keystore size=${FILE_BYTES} bytes, header=0x${MAGIC_HEX})."
              elif echo "$KS_OUT" | grep -qi -E "Invalid keystore format|Unrecognized keystore format|not a keystore"; then
                echo "::error::Keystore format validation failed: decoded file (size=${FILE_BYTES} bytes, header=0x${MAGIC_HEX}) is not a valid JKS/PKCS12 keystore (${SAFE_ERR})."
              else
                echo "::error::Keystore validation failed via keytool (size=${FILE_BYTES} bytes, header=0x${MAGIC_HEX}): ${SAFE_ERR}"
              fi
              exit 1
            fi
          fi

          # 3. Verify alias "upload", PrivateKeyEntry, and 2048-bit RSA key
          echo "Validating alias 'upload' and PrivateKeyEntry in my-upload-key.jks..."
          if ! CERT_INFO=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass:env CLEAN_STORE_PASS -alias "$CLEAN_ALIAS" 2>&1); then
            echo "::error::Alias '$CLEAN_ALIAS' was not found or could not be read in my-upload-key.jks."
            exit 1
          fi

          if ! echo "$CERT_INFO" | grep -q "PrivateKeyEntry"; then
            echo "::error::Alias '$CLEAN_ALIAS' is not a PrivateKeyEntry in my-upload-key.jks."
            exit 1
          fi

          if ! echo "$CERT_INFO" | grep -qi -E "2048-bit RSA|RSA.*2048"; then
            echo "::error::Alias '$CLEAN_ALIAS' does not contain the expected 2048-bit RSA key."
            exit 1
          fi

          # 4. Compare decoded certificate SHA-256 with the exact verified fingerprint
          ACTUAL_SHA256=$(echo "$CERT_INFO" | awk '/SHA256:/ {print $2; exit}' | tr '[:lower:]' '[:upper:]')
          if [ -z "$ACTUAL_SHA256" ]; then
            echo "::error::Failed to extract certificate SHA-256 fingerprint for alias '$CLEAN_ALIAS'."
            exit 1
          fi

          if [ "$ACTUAL_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Certificate SHA-256 mismatch! Expected '$EXPECTED_CERT_SHA256', got '$ACTUAL_SHA256'."
            exit 1
          fi

          # 5. Verify store password and private key password through actual signing test
          echo "Verifying private key password (KEY_PASSWORD) for alias '$CLEAN_ALIAS'..."
          TEMP_JAR=$(mktemp /tmp/keypass_play_verify_XXXXXX.jar)
          jar cf "$TEMP_JAR" README.md
          if ! jarsigner -keystore "$KEYSTORE_PATH" -storepass:env CLEAN_STORE_PASS -keypass:env CLEAN_KEY_PASS "$TEMP_JAR" "$CLEAN_ALIAS" >/dev/null 2>&1; then
            if [ "$TRIMMED_KEY_PASS" != "$CLEAN_KEY_PASS" ] && [ -n "$TRIMMED_KEY_PASS" ] && jarsigner -keystore "$KEYSTORE_PATH" -storepass:env CLEAN_STORE_PASS -keypass:env TRIMMED_KEY_PASS "$TEMP_JAR" "$CLEAN_ALIAS" >/dev/null 2>&1; then
              CLEAN_KEY_PASS="$TRIMMED_KEY_PASS"
              export CLEAN_KEY_PASS
            elif jarsigner -keystore "$KEYSTORE_PATH" -storepass:env CLEAN_STORE_PASS -keypass:env CLEAN_STORE_PASS "$TEMP_JAR" "$CLEAN_ALIAS" >/dev/null 2>&1; then
              CLEAN_KEY_PASS="$CLEAN_STORE_PASS"
              export CLEAN_KEY_PASS
            else
              rm -f "$TEMP_JAR"
              echo "::error::Private key password (KEY_PASSWORD) verification failed for alias '$CLEAN_ALIAS'."
              exit 1
            fi
          fi
          rm -f "$TEMP_JAR"

          echo "============================================================"
          echo "  Verified Upload Keystore Certificate Summary"
          echo "============================================================"
          echo "$CERT_INFO" | grep -E "Keystore type:|Alias name:|Entry type:|Owner:|Issuer:|Valid from:|SHA1:|SHA256:|Signature algorithm name:|Subject Public Key Algorithm:" || true
          echo "============================================================"
          echo "expected_sha256=${ACTUAL_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Ensure Gradle Wrapper is Executable
        run: chmod +x gradlew

      - name: Build Signed Google Play Release Bundle (:app:bundleRelease)
        id: build_aab
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ needs.build-verify-and-release.outputs.version_name }}
          APP_VERSION_CODE: ${{ needs.build-verify-and-release.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +x
          ./gradlew :app:bundleRelease --no-daemon

          if [ ! -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "::error::bundleRelease completed but app/build/outputs/bundle/release/app-release.aab was not generated."
            exit 1
          fi

          mkdir -p play-bundle-artifacts
          VER="${{ needs.build-verify-and-release.outputs.version_name }}"
          CODE="${{ needs.build-verify-and-release.outputs.version_code }}"
          cp app/build/outputs/bundle/release/app-release.aab "play-bundle-artifacts/PulsePlay-v${VER}-vc${CODE}-release.aab"
          cd play-bundle-artifacts
          sha256sum * > SHA256SUMS-AAB.txt

      - name: Verify Google Play AAB Signing Certificate
        id: verify_aab_cert
        run: |
          VER="${{ needs.build-verify-and-release.outputs.version_name }}"
          CODE="${{ needs.build-verify-and-release.outputs.version_code }}"
          AAB_FILE="play-bundle-artifacts/PulsePlay-v${VER}-vc${CODE}-release.aab"
          EXPECTED_SHA256="${EXPECTED_CERT_SHA256}"
          EXPECTED_SHA256_HEX=$(echo "$EXPECTED_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')

          if [ ! -f "$AAB_FILE" ]; then
            echo "::error::Signed AAB $AAB_FILE not found for verification."
            exit 1
          fi

          if ! jarsigner -verify -verbose -certs "$AAB_FILE" >/dev/null 2>&1; then
            echo "::error::jarsigner verification failed for $AAB_FILE."
            exit 1
          fi

          AAB_CERT_INFO=$(keytool -printcert -jarfile "$AAB_FILE" 2>/dev/null)
          AAB_SHA256=$(echo "$AAB_CERT_INFO" | awk '/SHA256:/ {print $2; exit}' | tr '[:lower:]' '[:upper:]')
          AAB_SHA256_HEX=$(echo "$AAB_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          AAB_FILESIZE=$(stat -c%s "$AAB_FILE")

          echo "============================================================"
          echo "  Google Play AAB Signing Certificate Verification"
          echo "============================================================"
          echo "AAB Filename:            $(basename "$AAB_FILE")"
          echo "AAB File Size:           $AAB_FILESIZE bytes"
          echo "AAB Certificate SHA-256: $AAB_SHA256"
          echo "Expected Upload SHA-256: $EXPECTED_SHA256"
          echo "============================================================"

          AAB_STATUS="PASS"
          if [ -z "$AAB_SHA256_HEX" ] || [ "$AAB_SHA256_HEX" != "$EXPECTED_SHA256_HEX" ]; then
            AAB_STATUS="FAIL"
          fi

          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "## 📦 Google Play Store AAB Signing Certificate Verification"
              echo ""
              echo "| Bundle Filename | Package ID | Signer SHA-256 | Expected SHA-256 | Verification |"
              echo "| :--- | :--- | :--- | :--- | :---: |"
              echo "| \`$(basename "$AAB_FILE")\` | \`com.aistudio.pulseplay.mpxvqr\` | \`${AAB_SHA256}\` | \`${EXPECTED_SHA256}\` | **${AAB_STATUS}** |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$AAB_STATUS" != "PASS" ]; then
            echo "::error::AAB certificate SHA-256 ($AAB_SHA256) does not match verified upload keystore SHA-256 ($EXPECTED_SHA256)."
            exit 1
          fi

          echo "Google Play AAB signing certificate verified: $EXPECTED_SHA256"

      - name: Upload Signed Google Play AAB Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pulseplay-play-store-aab-v${{ needs.build-verify-and-release.outputs.version_name }}
          path: play-bundle-artifacts/*
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Verify Play Console Credentials Before Upload
        id: play_credentials
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_play_store == true
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set +x
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is not configured yet. Skipping Play Console upload; signed AAB artifact has been archived for manual Play Console upload."
            echo "can_upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "can_upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Signed AAB to Google Play Track (${{ inputs.play_track }})
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_play_store == true && steps.play_credentials.outputs.can_upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.aistudio.pulseplay.mpxvqr
          releaseFiles: play-bundle-artifacts/*.aab
          track: ${{ inputs.play_track }}
          status: completed

      - name: Clean Up Decoded Upload Keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"
