name: Android CI, GitHub Release & Google Play Bundle

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_github_release:
        description: "Publish a GitHub Release with APK & SHA-256 checksums"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release version tag (e.g., v1.0.1) when triggered manually"
        required: false
        default: "v1.0.1"
        type: string
      prerelease:
        description: "Mark GitHub release as pre-release"
        required: false
        default: false
        type: boolean
      build_play_bundle:
        description: "Build signed Google Play Android App Bundle (:app:bundleRelease)"
        required: false
        default: true
        type: boolean
      publish_to_play_store:
        description: "Upload signed AAB to Google Play Console (requires GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret)"
        required: false
        default: false
        type: boolean
      play_track:
        description: "Google Play release track (internal/alpha/beta recommended before production)"
        required: false
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

# Least-privilege default permissions for all jobs (including pull_request)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_CERT_SHA256: "39:11:67:E3:46:A0:50:E1:1E:74:56:28:37:CD:2E:AB:C5:09:E2:39:A5:91:40:D9:74:42:6C:49:64:F8:88:C7"

jobs:
  build-verify-and-release:
    name: Test, Lint, Build APK & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    outputs:
      release_tag: ${{ steps.version_meta.outputs.release_tag }}
      version_name: ${{ steps.version_meta.outputs.version_name }}
      version_code: ${{ steps.version_meta.outputs.version_code }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Resolve Monotonic Version Metadata Across Channels
        id: version_meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            RAW_TAG="${{ inputs.release_tag }}"
          else
            RAW_TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          # Monotonically increasing versionCode across GitHub Releases and Google Play tracks
          MONOTONIC_CODE=$(( 100 + ${GITHUB_RUN_NUMBER:-1} ))
          echo "release_tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${MONOTONIC_CODE}" >> "$GITHUB_OUTPUT"

      - name: Load Existing Keystore from GitHub Secrets
        id: load_keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Verify all 4 required signing secrets are present
          CLEAN_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n\t ')
          CLEAN_STORE_PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')

          MISSING_SECRETS=""
          [ -z "$KEYSTORE_BASE64" ] && MISSING_SECRETS="${MISSING_SECRETS} KEYSTORE_BASE64"
          [ -z "$CLEAN_STORE_PASS" ] && MISSING_SECRETS="${MISSING_SECRETS} KEYSTORE_PASSWORD"
          [ -z "$CLEAN_ALIAS" ] && MISSING_SECRETS="${MISSING_SECRETS} KEY_ALIAS"
          [ -z "$CLEAN_KEY_PASS" ] && MISSING_SECRETS="${MISSING_SECRETS} KEY_PASSWORD"

          if [ -n "$MISSING_SECRETS" ]; then
            echo "::error::Missing required repository signing secret(s):${MISSING_SECRETS}. Refusing to generate or substitute another certificate."
            exit 1
          fi

          # 2. Robust whitespace cleanup using printf and tr (stripping \r, \n, \t, and space)
          CLEAN_BASE64=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ')

          if [ -z "$CLEAN_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty after stripping whitespace."
            exit 1
          fi

          # 3. Normalize URL-safe Base64 (- and _) to standard Base64 (+ and /)
          CLEAN_BASE64=$(printf '%s' "$CLEAN_BASE64" | tr -- '-_' '+/')

          # 4. Reject invalid Base64 data (only valid Base64 characters permitted: A-Z, a-z, 0-9, +, /, =)
          if ! printf '%s' "$CLEAN_BASE64" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
            echo "::error::Base64 validation failed: KEYSTORE_BASE64 contains invalid characters not allowed in standard Base64 encoding (e.g. quotation marks, PEM headers, or punctuation). Ensure only raw base64 data was added."
            exit 1
          fi

          # 5. Restore missing '=' padding if trailing padding was truncated when saving secret
          B64_REM=$(( ${#CLEAN_BASE64} % 4 ))
          if [ "$B64_REM" -eq 2 ]; then
            echo "Notice: Restoring 2 missing '=' padding characters (length had remainder 2)..."
            CLEAN_BASE64="${CLEAN_BASE64}=="
          elif [ "$B64_REM" -eq 3 ]; then
            echo "Notice: Restoring 1 missing '=' padding character (length had remainder 3)..."
            CLEAN_BASE64="${CLEAN_BASE64}="
          elif [ "$B64_REM" -eq 1 ]; then
            echo "::error::Base64 length validation failed: KEYSTORE_BASE64 length (${#CLEAN_BASE64}) has a remainder of 1 when divided by 4. Single-character truncation cannot represent valid data. Check the secret value."
            exit 1
          fi

          B64_LEN=${#CLEAN_BASE64}

          # 6. Decode strictly to binary file without corrupting binary data
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          DECODE_LOG="${GITHUB_WORKSPACE}/base64_decode_err.log"

          echo "Decoding existing signing keystore from KEYSTORE_BASE64 secret (${B64_LEN} base64 chars)..."
          if ! printf '%s' "$CLEAN_BASE64" | base64 --decode > "$KEYSTORE_FILE" 2> "$DECODE_LOG"; then
            DECODE_ERR=$(cat "$DECODE_LOG" 2>/dev/null)
            echo "::error::Base64 decoding failed: ${DECODE_ERR:-base64: invalid input}"
            rm -f "$DECODE_LOG"
            exit 1
          fi
          rm -f "$DECODE_LOG"

          # 7. Verify decoded JKS file exists, is readable, and is non-empty
          if [ ! -f "$KEYSTORE_FILE" ] || [ ! -r "$KEYSTORE_FILE" ] || [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Base64 decoding produced a missing, unreadable, or empty keystore file ($KEYSTORE_FILE)."
            exit 1
          fi

          FILE_BYTES=$(wc -c < "$KEYSTORE_FILE" | tr -d ' ')
          echo "Successfully decoded my-upload-key.jks ($FILE_BYTES bytes)."
          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
          echo "keystore_loaded=true" >> "$GITHUB_OUTPUT"

      - name: Validate Existing Keystore, Alias & Certificate SHA-256
        id: validate_keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -r "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Keystore file is missing, unreadable, or empty at KEYSTORE_PATH ($KEYSTORE_PATH)."
            exit 1
          fi

          CLEAN_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n\t ')
          CLEAN_STORE_PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')

          # 1. Validate alias is "upload"
          if [ "$CLEAN_ALIAS" != "upload" ]; then
            echo "::error::Invalid KEY_ALIAS ('$CLEAN_ALIAS'). Expected alias 'upload' for my-upload-key.jks."
            exit 1
          fi

          # 2. Test keystore integrity and store password with keytool
          echo "Verifying keystore integrity and KEYSTORE_PASSWORD..."
          if ! KS_OUT=$(keytool -list -keystore "$KEYSTORE_PATH" -storepass "$CLEAN_STORE_PASS" 2>&1); then
            if echo "$KS_OUT" | grep -qi "password was incorrect"; then
              echo "::error::Password validation failed: KEYSTORE_PASSWORD was incorrect for the decoded keystore."
            elif echo "$KS_OUT" | grep -qi -E "Invalid keystore format|not a keystore"; then
              echo "::error::Keystore integrity validation failed: The decoded file is not a valid keystore. The Base64 data may be corrupted."
            else
              echo "::error::Keystore integrity or store password validation failed: $KS_OUT"
            fi
            exit 1
          fi

          # 3. Validate alias "upload" existence and entry metadata in keystore
          echo "Validating alias '$CLEAN_ALIAS' in my-upload-key.jks..."
          if ! CERT_INFO=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$CLEAN_STORE_PASS" -alias "$CLEAN_ALIAS" 2>&1); then
            if echo "$CERT_INFO" | grep -qi "does not exist"; then
              echo "::error::Alias validation failed: KEY_ALIAS ('$CLEAN_ALIAS') was not found in the keystore."
              echo "Available entry aliases in keystore:"
              echo "$KS_OUT" | grep "Entry" || true
            else
              echo "::error::Keystore entry validation failed for alias '$CLEAN_ALIAS': $CERT_INFO"
            fi
            exit 1
          fi

          if ! echo "$CERT_INFO" | grep -q "PrivateKeyEntry"; then
            echo "::error::Alias '$CLEAN_ALIAS' is not a PrivateKeyEntry in the keystore."
            exit 1
          fi

          # 4. Extract and compare decoded certificate SHA-256 against verified fingerprint
          ACTUAL_SHA256=$(echo "$CERT_INFO" | awk '/SHA256:/ {print $2; exit}' | tr '[:lower:]' '[:upper:]')
          if [ -z "$ACTUAL_SHA256" ]; then
            echo "::error::Could not extract SHA-256 certificate fingerprint from keystore for alias '$CLEAN_ALIAS'."
            exit 1
          fi

          if [ "$ACTUAL_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Keystore certificate SHA-256 mismatch! Expected '$EXPECTED_CERT_SHA256', but decoded keystore has '$ACTUAL_SHA256'."
            exit 1
          fi

          # 5. Pre-validate private key password (KEY_PASSWORD) using jarsigner
          echo "Verifying private key password (KEY_PASSWORD) for alias '$CLEAN_ALIAS'..."
          TEMP_JAR=$(mktemp /tmp/keypass_check_XXXXXX.jar)
          jar cf "$TEMP_JAR" README.md
          if ! JARSIGN_OUT=$(jarsigner -keystore "$KEYSTORE_PATH" -storepass "$CLEAN_STORE_PASS" -keypass "$CLEAN_KEY_PASS" "$TEMP_JAR" "$CLEAN_ALIAS" 2>&1); then
            rm -f "$TEMP_JAR"
            echo "::error::Private key password (KEY_PASSWORD) validation failed for alias '$CLEAN_ALIAS': $JARSIGN_OUT"
            exit 1
          fi
          rm -f "$TEMP_JAR"

          echo "============================================================"
          echo "  Existing Keystore Certificate & Private Key Validated"
          echo "============================================================"
          echo "$CERT_INFO" | grep -E "Keystore type:|Alias name:|Entry type:|Owner:|Issuer:|Serial number:|Valid from:|SHA1:|SHA256:|Signature algorithm name:|Subject Public Key Algorithm:" || true
          echo "============================================================"
          echo "expected_sha256=${ACTUAL_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Ensure Gradle Wrapper is Executable
        run: chmod +x gradlew

      - name: Execute Unit & Robolectric Tests
        env:
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Execute Android Lint Verification
        env:
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Notice for Untrusted Pull Requests (No Signing Secrets Exposed)
        if: github.event_name == 'pull_request'
        run: |
          echo "============================================================"
          echo "  Pull Request Verification Complete (Tests & Lint Passed)"
          echo "  Note: GitHub Actions does not expose repository signing secrets"
          echo "  (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
          echo "  to pull_request runs. APK packaging is skipped because all"
          echo "  PulsePlay build variants strictly require the single existing"
          echo "  repository signing key and never generate temporary certificates."
          echo "============================================================"

      - name: Build Debug APK Using Existing Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::assembleDebug failed to produce app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

      - name: Build Release APK Using Existing Keystore
        id: release_signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          if [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "::error::assembleRelease failed to produce app/build/outputs/apk/release/app-release.apk"
            exit 1
          fi
          echo "signed_release_built=true" >> "$GITHUB_OUTPUT"

      - name: Prepare Release Assets & SHA-256 Checksums
        id: prepare_assets
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release-assets
          VER="${{ steps.version_meta.outputs.version_name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/PulsePlay-v${VER}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/PulsePlay-v${VER}-release.apk"
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Verify Both APK Signatures & Identical Certificate Fingerprints
        id: verify_apk_cert
        if: github.event_name != 'pull_request'
        run: |
          # Locate apksigner tool from Android SDK build-tools
          if command -v apksigner >/dev/null 2>&1; then
            APKSIGNER="apksigner"
          elif [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT/build-tools" ]; then
            APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          else
            APKSIGNER=$(find /opt/android/sdk/build-tools /usr/local/lib/android/sdk/build-tools -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner tool not found in environment."
            exit 1
          fi

          VER="${{ steps.version_meta.outputs.version_name }}"
          DEBUG_APK="release-assets/PulsePlay-v${VER}-debug.apk"
          RELEASE_APK="release-assets/PulsePlay-v${VER}-release.apk"
          EXPECTED_SHA256="${EXPECTED_CERT_SHA256}"
          EXPECTED_SHA256_HEX=$(echo "$EXPECTED_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')

          for APK_FILE in "$DEBUG_APK" "$RELEASE_APK"; do
            if [ ! -f "$APK_FILE" ]; then
              echo "::error::Expected APK file $APK_FILE not found for signature verification."
              exit 1
            fi
            APK_FILENAME=$(basename "$APK_FILE")
            APK_SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
            APK_FILESIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || wc -c < "$APK_FILE")
            echo "============================================================"
            echo "  Verifying APK Signature: $APK_FILENAME"
            echo "  File Size:        $APK_FILESIZE bytes"
            echo "  File SHA-256:     $APK_SHA256"
            echo "------------------------------------------------------------"
            "$APKSIGNER" verify --print-certs -v "$APK_FILE"
            echo "============================================================"
          done

          DEBUG_CERT_SHA256=$("$APKSIGNER" verify --print-certs "$DEBUG_APK" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]')
          RELEASE_CERT_SHA256=$("$APKSIGNER" verify --print-certs "$RELEASE_APK" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]')

          echo "Debug APK Certificate SHA-256:   $DEBUG_CERT_SHA256"
          echo "Release APK Certificate SHA-256: $RELEASE_CERT_SHA256"
          echo "Verified Expected SHA-256:       $EXPECTED_SHA256_HEX"

          if [ -z "$DEBUG_CERT_SHA256" ] || [ -z "$RELEASE_CERT_SHA256" ]; then
            echo "::error::Failed to extract certificate SHA-256 digest from one or both APKs."
            exit 1
          fi

          if [ "$DEBUG_CERT_SHA256" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::Certificate mismatch! Debug APK ($DEBUG_CERT_SHA256) and Release APK ($RELEASE_CERT_SHA256) were not signed with the same certificate."
            exit 1
          fi

          if [ "$DEBUG_CERT_SHA256" != "$EXPECTED_SHA256_HEX" ]; then
            echo "::error::APK certificate digest ($DEBUG_CERT_SHA256) does not match the verified keystore certificate ($EXPECTED_SHA256_HEX)."
            exit 1
          fi

          echo "Single signing identity verified: Debug APK and Release APK share identical SHA-256 certificate ($EXPECTED_SHA256)."

      - name: Upload Build Artifacts (Workflow Run)
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pulseplay-apk-artifacts-v${{ steps.version_meta.outputs.version_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Upload Diagnostic Test & Lint Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pulseplay-failure-diagnostics-${{ github.run_number }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Publish GitHub Release
        if: >
          success() &&
          github.event_name != 'pull_request' &&
          (startsWith(github.ref, 'refs/tags/v') ||
           (github.event_name == 'workflow_dispatch' && inputs.create_github_release == true))
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version_meta.outputs.release_tag }}
          name: "PulsePlay ${{ steps.version_meta.outputs.release_tag }}"
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ### PulsePlay ${{ steps.version_meta.outputs.release_tag }}
            - **versionName**: `${{ steps.version_meta.outputs.version_name }}`
            - **versionCode**: `${{ steps.version_meta.outputs.version_code }}`
            - **Unified Signing Certificate SHA-256**: `${{ steps.validate_keystore.outputs.expected_sha256 }}`
            - Both `PulsePlay-v${{ steps.version_meta.outputs.version_name }}-debug.apk` and `PulsePlay-v${{ steps.version_meta.outputs.version_name }}-release.apk` are signed with the same repository keystore (`alias: upload`).
            - Verify downloaded APK integrity against `SHA256SUMS.txt` or via the in-app **Settings → App Updates** updater.
          files: |
            release-assets/*

      - name: Clean Up Temporary Release Keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"

  google-play-bundle:
    name: Google Play Store Bundle & Track Deployment
    needs: build-verify-and-release
    if: >
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' ||
       inputs.build_play_bundle == true ||
       inputs.publish_to_play_store == true)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Load Existing Keystore from GitHub Secrets
        id: load_play_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Verify all 4 required signing secrets are present
          CLEAN_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n\t ')
          CLEAN_STORE_PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')

          MISSING_SECRETS=""
          [ -z "$KEYSTORE_BASE64" ] && MISSING_SECRETS="${MISSING_SECRETS} KEYSTORE_BASE64"
          [ -z "$CLEAN_STORE_PASS" ] && MISSING_SECRETS="${MISSING_SECRETS} KEYSTORE_PASSWORD"
          [ -z "$CLEAN_ALIAS" ] && MISSING_SECRETS="${MISSING_SECRETS} KEY_ALIAS"
          [ -z "$CLEAN_KEY_PASS" ] && MISSING_SECRETS="${MISSING_SECRETS} KEY_PASSWORD"

          if [ -n "$MISSING_SECRETS" ]; then
            echo "::error::Google Play App Bundles require repository signing secrets:${MISSING_SECRETS}. Refusing to generate or substitute another certificate."
            exit 1
          fi

          # 2. Robust whitespace cleanup using printf and tr (stripping \r, \n, \t, and space)
          CLEAN_BASE64=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ')

          if [ -z "$CLEAN_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty after stripping whitespace."
            exit 1
          fi

          # 3. Normalize URL-safe Base64 (- and _) to standard Base64 (+ and /)
          CLEAN_BASE64=$(printf '%s' "$CLEAN_BASE64" | tr -- '-_' '+/')

          # 4. Reject invalid Base64 data (only valid Base64 characters permitted: A-Z, a-z, 0-9, +, /, =)
          if ! printf '%s' "$CLEAN_BASE64" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
            echo "::error::Base64 validation failed: KEYSTORE_BASE64 contains invalid characters not allowed in standard Base64 encoding. Ensure only raw base64 data was added."
            exit 1
          fi

          # 5. Restore missing '=' padding if trailing padding was truncated when saving secret
          B64_REM=$(( ${#CLEAN_BASE64} % 4 ))
          if [ "$B64_REM" -eq 2 ]; then
            echo "Notice: Restoring 2 missing '=' padding characters for Google Play bundle..."
            CLEAN_BASE64="${CLEAN_BASE64}=="
          elif [ "$B64_REM" -eq 3 ]; then
            echo "Notice: Restoring 1 missing '=' padding character for Google Play bundle..."
            CLEAN_BASE64="${CLEAN_BASE64}="
          elif [ "$B64_REM" -eq 1 ]; then
            echo "::error::Base64 length validation failed: KEYSTORE_BASE64 length (${#CLEAN_BASE64}) has a remainder of 1 when divided by 4. Single-character truncation cannot represent valid data. Check the secret value."
            exit 1
          fi

          B64_LEN=${#CLEAN_BASE64}

          # 6. Decode strictly to binary file without corrupting binary data
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          DECODE_LOG="${GITHUB_WORKSPACE}/play_base64_decode_err.log"

          echo "Decoding existing signing keystore for Google Play bundle (${B64_LEN} base64 chars)..."
          if ! printf '%s' "$CLEAN_BASE64" | base64 --decode > "$KEYSTORE_FILE" 2> "$DECODE_LOG"; then
            DECODE_ERR=$(cat "$DECODE_LOG" 2>/dev/null)
            echo "::error::Base64 decoding failed: ${DECODE_ERR:-base64: invalid input}"
            rm -f "$DECODE_LOG"
            exit 1
          fi
          rm -f "$DECODE_LOG"

          # 7. Verify decoded JKS file exists, is readable, and is non-empty
          if [ ! -f "$KEYSTORE_FILE" ] || [ ! -r "$KEYSTORE_FILE" ] || [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Base64 decoding produced a missing, unreadable, or empty keystore file ($KEYSTORE_FILE)."
            exit 1
          fi

          FILE_BYTES=$(wc -c < "$KEYSTORE_FILE" | tr -d ' ')
          echo "Successfully decoded my-upload-key.jks ($FILE_BYTES bytes) for Google Play bundle."
          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
          echo "keystore_loaded=true" >> "$GITHUB_OUTPUT"

      - name: Validate Existing Keystore, Alias & Certificate SHA-256
        id: validate_play_keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -r "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Keystore file is missing, unreadable, or empty at KEYSTORE_PATH ($KEYSTORE_PATH)."
            exit 1
          fi

          CLEAN_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n\t ')
          CLEAN_STORE_PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')

          # 1. Validate alias is "upload"
          if [ "$CLEAN_ALIAS" != "upload" ]; then
            echo "::error::Invalid KEY_ALIAS ('$CLEAN_ALIAS'). Expected alias 'upload' for my-upload-key.jks."
            exit 1
          fi

          # 2. Test keystore integrity and store password with keytool
          echo "Verifying keystore integrity and KEYSTORE_PASSWORD for Play bundle..."
          if ! KS_OUT=$(keytool -list -keystore "$KEYSTORE_PATH" -storepass "$CLEAN_STORE_PASS" 2>&1); then
            if echo "$KS_OUT" | grep -qi "password was incorrect"; then
              echo "::error::Password validation failed: KEYSTORE_PASSWORD was incorrect for the decoded keystore."
            elif echo "$KS_OUT" | grep -qi -E "Invalid keystore format|not a keystore"; then
              echo "::error::Keystore integrity validation failed: The decoded file is not a valid keystore."
            else
              echo "::error::Keystore integrity or store password validation failed: $KS_OUT"
            fi
            exit 1
          fi

          # 3. Validate alias "upload" existence and entry metadata in keystore
          echo "Validating alias '$CLEAN_ALIAS' in my-upload-key.jks..."
          if ! CERT_INFO=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$CLEAN_STORE_PASS" -alias "$CLEAN_ALIAS" 2>&1); then
            if echo "$CERT_INFO" | grep -qi "does not exist"; then
              echo "::error::Alias validation failed: KEY_ALIAS ('$CLEAN_ALIAS') was not found in the keystore."
              echo "Available entry aliases in keystore:"
              echo "$KS_OUT" | grep "Entry" || true
            else
              echo "::error::Keystore entry validation failed for alias '$CLEAN_ALIAS': $CERT_INFO"
            fi
            exit 1
          fi

          if ! echo "$CERT_INFO" | grep -q "PrivateKeyEntry"; then
            echo "::error::Alias '$CLEAN_ALIAS' is not a PrivateKeyEntry in the keystore."
            exit 1
          fi

          # 4. Extract and compare decoded certificate SHA-256 against verified fingerprint
          ACTUAL_SHA256=$(echo "$CERT_INFO" | awk '/SHA256:/ {print $2; exit}' | tr '[:lower:]' '[:upper:]')
          if [ -z "$ACTUAL_SHA256" ]; then
            echo "::error::Could not extract SHA-256 certificate fingerprint from keystore for alias '$CLEAN_ALIAS'."
            exit 1
          fi

          if [ "$ACTUAL_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Keystore certificate SHA-256 mismatch! Expected '$EXPECTED_CERT_SHA256', but decoded keystore has '$ACTUAL_SHA256'."
            exit 1
          fi

          # 5. Pre-validate private key password (KEY_PASSWORD) using jarsigner
          echo "Verifying private key password (KEY_PASSWORD) for alias '$CLEAN_ALIAS'..."
          TEMP_JAR=$(mktemp /tmp/keypass_play_check_XXXXXX.jar)
          jar cf "$TEMP_JAR" README.md
          if ! JARSIGN_OUT=$(jarsigner -keystore "$KEYSTORE_PATH" -storepass "$CLEAN_STORE_PASS" -keypass "$CLEAN_KEY_PASS" "$TEMP_JAR" "$CLEAN_ALIAS" 2>&1); then
            rm -f "$TEMP_JAR"
            echo "::error::Private key password (KEY_PASSWORD) validation failed for alias '$CLEAN_ALIAS': $JARSIGN_OUT"
            exit 1
          fi
          rm -f "$TEMP_JAR"

          echo "============================================================"
          echo "  Existing Keystore Certificate & Private Key Validated"
          echo "============================================================"
          echo "$CERT_INFO" | grep -E "Keystore type:|Alias name:|Entry type:|Owner:|Issuer:|Serial number:|Valid from:|SHA1:|SHA256:|Signature algorithm name:|Subject Public Key Algorithm:" || true
          echo "============================================================"
          echo "expected_sha256=${ACTUAL_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Ensure Gradle Wrapper is Executable
        run: chmod +x gradlew

      - name: Build Signed Google Play Release Bundle (:app:bundleRelease)
        id: build_aab
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ needs.build-verify-and-release.outputs.version_name }}
          APP_VERSION_CODE: ${{ needs.build-verify-and-release.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./gradlew :app:bundleRelease --no-daemon

          if [ ! -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "::error::bundleRelease completed but app/build/outputs/bundle/release/app-release.aab was not generated."
            exit 1
          fi

          mkdir -p play-bundle-artifacts
          VER="${{ needs.build-verify-and-release.outputs.version_name }}"
          CODE="${{ needs.build-verify-and-release.outputs.version_code }}"
          cp app/build/outputs/bundle/release/app-release.aab "play-bundle-artifacts/PulsePlay-v${VER}-vc${CODE}-release.aab"
          cd play-bundle-artifacts
          sha256sum * > SHA256SUMS-AAB.txt

      - name: Verify Google Play AAB Signing Identity
        id: verify_aab_cert
        run: |
          VER="${{ needs.build-verify-and-release.outputs.version_name }}"
          CODE="${{ needs.build-verify-and-release.outputs.version_code }}"
          AAB_FILE="play-bundle-artifacts/PulsePlay-v${VER}-vc${CODE}-release.aab"
          EXPECTED_SHA256="${EXPECTED_CERT_SHA256}"
          EXPECTED_SHA256_HEX=$(echo "$EXPECTED_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')

          if [ ! -f "$AAB_FILE" ]; then
            echo "::error::Signed AAB $AAB_FILE not found for verification."
            exit 1
          fi

          if ! jarsigner -verify -verbose -certs "$AAB_FILE" >/dev/null 2>&1; then
            echo "::error::jarsigner verification failed for $AAB_FILE."
            exit 1
          fi

          AAB_CERT_INFO=$(keytool -printcert -jarfile "$AAB_FILE" 2>/dev/null)
          AAB_SHA256=$(echo "$AAB_CERT_INFO" | awk '/SHA256:/ {print $2; exit}' | tr '[:lower:]' '[:upper:]')
          AAB_SHA256_HEX=$(echo "$AAB_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')

          echo "============================================================"
          echo "  Google Play AAB Signing Certificate Verification"
          echo "============================================================"
          echo "AAB Filename:            $(basename "$AAB_FILE")"
          echo "AAB Certificate SHA-256: $AAB_SHA256"
          echo "Verified Expected SHA-256: $EXPECTED_SHA256"
          echo "============================================================"

          if [ -z "$AAB_SHA256_HEX" ] || [ "$AAB_SHA256_HEX" != "$EXPECTED_SHA256_HEX" ]; then
            echo "::error::AAB certificate SHA-256 ($AAB_SHA256) does not match verified keystore SHA-256 ($EXPECTED_SHA256)."
            exit 1
          fi

          echo "Single signing identity verified: Google Play AAB is signed with certificate ($EXPECTED_SHA256)."

      - name: Upload Signed Google Play AAB Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pulseplay-play-store-aab-v${{ needs.build-verify-and-release.outputs.version_name }}
          path: play-bundle-artifacts/*
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Verify Play Console Credentials Before Upload
        id: play_credentials
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_play_store == true
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is not configured yet. Skipping Play Console upload; signed AAB artifact has been archived for manual Play Console upload."
            echo "can_upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "can_upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Signed AAB to Google Play Track (${{ inputs.play_track }})
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_play_store == true && steps.play_credentials.outputs.can_upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.aistudio.pulseplay.mpxvqr
          releaseFiles: play-bundle-artifacts/*.aab
          track: ${{ inputs.play_track }}
          status: completed

      - name: Clean Up Temporary Upload Keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"
