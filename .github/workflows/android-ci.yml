name: Android CI, GitHub Release & Google Play Bundle

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_github_release:
        description: "Publish a GitHub Release with APK & SHA-256 checksums"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release version tag (e.g., v1.0.1) when triggered manually"
        required: false
        default: "v1.0.1"
        type: string
      prerelease:
        description: "Mark GitHub release as pre-release"
        required: false
        default: false
        type: boolean
      build_play_bundle:
        description: "Build signed Google Play Android App Bundle (:app:bundleRelease)"
        required: false
        default: false
        type: boolean
      publish_to_play_store:
        description: "Upload signed AAB to Google Play Console (requires GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret)"
        required: false
        default: false
        type: boolean
      play_track:
        description: "Google Play release track (internal/alpha/beta recommended before production)"
        required: false
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

# Least-privilege default permissions for all jobs (including pull_request)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verify-and-release:
    name: Test, Lint, Build APK & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    outputs:
      release_tag: ${{ steps.version_meta.outputs.release_tag }}
      version_name: ${{ steps.version_meta.outputs.version_name }}
      version_code: ${{ steps.version_meta.outputs.version_code }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Resolve Monotonic Version Metadata Across Channels
        id: version_meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            RAW_TAG="${{ inputs.release_tag }}"
          else
            RAW_TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          # Monotonically increasing versionCode across GitHub Releases and Google Play tracks
          MONOTONIC_CODE=$(( 100 + ${GITHUB_RUN_NUMBER:-1} ))
          echo "release_tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${MONOTONIC_CODE}" >> "$GITHUB_OUTPUT"

      - name: Ensure Debug Keystore Exists for Reproducible Debug Signing
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Gradle Wrapper is Executable
        run: chmod +x gradlew

      - name: Execute Unit & Robolectric Tests
        env:
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Execute Android Lint Verification
        env:
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Assemble Installable Debug APK
        env:
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Assemble Signed Release APK (If Release Secrets Configured)
        id: release_signing
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEY_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Decoding release keystore from repository secrets..."
            # Safely decode Base64, handling possible whitespace/newlines in the secret
            echo "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            DECODE_EXIT=$?
            
            if [ $DECODE_EXIT -ne 0 ]; then
              echo "::error::Base64 decoding failed. The UPLOAD_KEY_BASE64 secret may be invalid or corrupted."
              exit 1
            fi

            export KEYSTORE_PATH="${GITHUB_WORKSPACE}/my-upload-key.jks"

            if [ ! -f "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
              echo "::error::Decoded keystore file does not exist or is empty. Please check UPLOAD_KEY_BASE64."
              exit 1
            fi

            echo "Verifying alias '$KEY_ALIAS' exists in the decoded keystore..."
            # Verify alias presence without logging sensitive data
            if ! keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              echo "::error::Keystore verification failed: Alias '$KEY_ALIAS' was not found in the keystore or store password is incorrect."
              # List aliases (names only) to help diagnose mismatch
              echo "Available aliases in keystore:"
              keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" | grep "Entry" || true
              exit 1
            fi
            echo "Keystore verified successfully. Alias '$KEY_ALIAS' confirmed."

            ./gradlew :app:assembleRelease --no-daemon
            BUILD_EXIT=$?
            
            if [ $BUILD_EXIT -ne 0 ] || [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then
              echo "::error::assembleRelease failed or output APK not found."
              exit 1
            fi
            echo "signed_release_built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release signing secrets (UPLOAD_KEY_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) not fully configured; packaging Debug-signed APK only."
            echo "signed_release_built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Release Assets & SHA-256 Checksums
        id: prepare_assets
        run: |
          mkdir -p release-assets
          VER="${{ steps.version_meta.outputs.version_name }}"
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/PulsePlay-v${VER}-debug.apk"
          if [ "${{ steps.release_signing.outputs.signed_release_built }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-assets/PulsePlay-v${VER}-release.apk"
          fi
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Verify APK Signature & Display Certificate Information
        id: verify_apk_cert
        run: |
          # Locate apksigner tool from Android SDK build-tools
          if command -v apksigner >/dev/null 2>&1; then
            APKSIGNER="apksigner"
          elif [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT/build-tools" ]; then
            APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          else
            APKSIGNER=$(find /opt/android/sdk/build-tools /usr/local/lib/android/sdk/build-tools -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner tool not found in environment."
            exit 1
          fi

          VER="${{ steps.version_meta.outputs.version_name }}"
          RELEASE_APK="release-assets/PulsePlay-v${VER}-release.apk"
          DEBUG_APK="release-assets/PulsePlay-v${VER}-debug.apk"

          if [ "${{ steps.release_signing.outputs.signed_release_built }}" = "true" ] && [ -f "$RELEASE_APK" ]; then
            TARGET_APK="$RELEASE_APK"
            IS_RELEASE_SIGNED=true
            echo "============================================================"
            echo "  Verifying Production Signed Release APK"
            echo "============================================================"
          else
            TARGET_APK="$DEBUG_APK"
            IS_RELEASE_SIGNED=false
            echo "============================================================"
            echo "  Notice: Release keystore secrets not configured or pull request."
            echo "  Verifying Debug-signed APK for verification diagnostics."
            echo "============================================================"
          fi

          if [ ! -f "$TARGET_APK" ]; then
            echo "::error::Target APK $TARGET_APK not found for certificate verification."
            exit 1
          fi

          APK_FILENAME=$(basename "$TARGET_APK")
          APK_SHA256=$(sha256sum "$TARGET_APK" | awk '{print $1}')
          APK_FILESIZE=$(stat -c%s "$TARGET_APK" 2>/dev/null || wc -c < "$TARGET_APK")

          echo "APK Filename:         $APK_FILENAME"
          echo "APK File Size:        $APK_FILESIZE bytes"
          echo "APK SHA-256 Checksum: $APK_SHA256"
          echo "------------------------------------------------------------"
          echo "Executing: apksigner verify --print-certs -v \"$TARGET_APK\""
          echo "------------------------------------------------------------"

          "$APKSIGNER" verify --print-certs -v "$TARGET_APK"
          VERIFY_EXIT=$?

          echo "------------------------------------------------------------"
          if [ $VERIFY_EXIT -eq 0 ]; then
            echo " Signature Status: VERIFIED VALID"
            if [ "$IS_RELEASE_SIGNED" = "true" ]; then
              echo " Production Release APK signature verified successfully."
            else
              echo " Debug APK signature verified successfully."
            fi
          else
            echo "::error::APK Signature Verification FAILED with exit code $VERIFY_EXIT"
            exit $VERIFY_EXIT
          fi
          echo "============================================================"

      - name: Upload Build Artifacts (Workflow Run)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pulseplay-apk-artifacts-v${{ steps.version_meta.outputs.version_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Upload Diagnostic Test & Lint Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pulseplay-failure-diagnostics-${{ github.run_number }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Publish GitHub Release
        if: >
          success() &&
          github.event_name != 'pull_request' &&
          (startsWith(github.ref, 'refs/tags/v') ||
           (github.event_name == 'workflow_dispatch' && inputs.create_github_release == true))
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version_meta.outputs.release_tag }}
          name: "PulsePlay ${{ steps.version_meta.outputs.release_tag }}"
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ### PulsePlay ${{ steps.version_meta.outputs.release_tag }}
            - **versionName**: `${{ steps.version_meta.outputs.version_name }}`
            - **versionCode**: `${{ steps.version_meta.outputs.version_code }}`
            - **Signed Production Release Built**: `${{ steps.release_signing.outputs.signed_release_built == 'true' && 'Yes (Release Keystore)' || 'No (Debug-Signed Build Only)' }}`
            - Verify downloaded APK integrity against `SHA256SUMS.txt` or via the in-app **Settings → App Updates** updater.
          files: |
            release-assets/*

      - name: Clean Up Temporary Release Keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"

  google-play-bundle:
    name: Google Play Store Bundle & Track Deployment (Manual / Guarded)
    needs: build-verify-and-release
    if: >
      github.event_name == 'workflow_dispatch' &&
      (inputs.build_play_bundle == true || inputs.publish_to_play_store == true)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle Wrapper is Executable
        run: chmod +x gradlew

      - name: Build Signed Google Play Release Bundle (:app:bundleRelease)
        id: build_aab
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEY_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ needs.build-verify-and-release.outputs.version_name }}
          APP_VERSION_CODE: ${{ needs.build-verify-and-release.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: Google Play App Bundles require UPLOAD_KEY_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets."
            exit 1
          fi
          echo "Decoding release keystore for Play Store bundle..."
          # Safely decode Base64, handling possible whitespace/newlines in the secret
          echo "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          DECODE_EXIT=$?
          
          if [ $DECODE_EXIT -ne 0 ]; then
            echo "::error::Base64 decoding failed. The UPLOAD_KEY_BASE64 secret may be invalid or corrupted."
            exit 1
          fi

          export KEYSTORE_PATH="${GITHUB_WORKSPACE}/my-upload-key.jks"

          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore file does not exist or is empty. Please check UPLOAD_KEY_BASE64."
            exit 1
          fi

          echo "Verifying alias '$KEY_ALIAS' exists in the decoded keystore for Play bundle..."
          if ! keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Keystore verification failed: Alias '$KEY_ALIAS' was not found in the keystore or store password is incorrect."
            # List aliases (names only) to help diagnose mismatch
            echo "Available aliases in keystore:"
            keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" | grep "Entry" || true
            exit 1
          fi
          echo "Keystore verified successfully. Alias '$KEY_ALIAS' confirmed."

          ./gradlew :app:bundleRelease --no-daemon

          if [ ! -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "::error::bundleRelease completed but app/build/outputs/bundle/release/app-release.aab was not generated."
            exit 1
          fi

          mkdir -p play-bundle-artifacts
          VER="${{ needs.build-verify-and-release.outputs.version_name }}"
          CODE="${{ needs.build-verify-and-release.outputs.version_code }}"
          cp app/build/outputs/bundle/release/app-release.aab "play-bundle-artifacts/PulsePlay-v${VER}-vc${CODE}-release.aab"
          cd play-bundle-artifacts
          sha256sum * > SHA256SUMS-AAB.txt

      - name: Upload Signed Google Play AAB Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pulseplay-play-store-aab-v${{ needs.build-verify-and-release.outputs.version_name }}
          path: play-bundle-artifacts/*
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Verify Play Console Credentials Before Upload
        id: play_credentials
        if: inputs.publish_to_play_store == true
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is not configured yet. Skipping Play Console upload; signed AAB artifact has been archived for manual Play Console upload."
            echo "can_upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "can_upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Signed AAB to Google Play Track (${{ inputs.play_track }})
        if: inputs.publish_to_play_store == true && steps.play_credentials.outputs.can_upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.aistudio.pulseplay.mpxvqr
          releaseFiles: play-bundle-artifacts/*.aab
          track: ${{ inputs.play_track }}
          status: completed

      - name: Clean Up Temporary Upload Keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"
