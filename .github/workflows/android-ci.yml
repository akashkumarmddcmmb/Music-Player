name: Android CI, GitHub Release & Google Play Bundle

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_github_release:
        description: "Publish a GitHub Release with APK, AAB & SHA-256 checksums"
        required: false
        default: true
        type: boolean
      release_tag:
        description: "Release version tag (e.g., v1.0.1) when triggered manually"
        required: false
        default: "v1.0.1"
        type: string
      prerelease:
        description: "Mark GitHub release as pre-release"
        required: false
        default: false
        type: boolean
      build_play_bundle:
        description: "Build signed Google Play Android App Bundle (:app:bundleRelease)"
        required: false
        default: true
        type: boolean
      publish_to_play_store:
        description: "Upload signed AAB to Google Play Console (requires GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret)"
        required: false
        default: false
        type: boolean
      play_track:
        description: "Google Play release track (internal/alpha/beta recommended before production)"
        required: false
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      file_manager_apk_url:
        description: "Optional File Manager APK direct URL for informational signing certificate comparison"
        required: false
        default: ""
        type: string

# Least-privilege default permissions for all jobs (including pull_request)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_CERT_SHA256: "2A:09:47:F6:3E:B7:80:D5:12:09:E4:82:08:39:25:AF:1E:04:26:6F:3E:BD:88:26:E0:C0:52:CE:4A:9B:99:B7"

jobs:
  build-verify-and-release:
    name: Test, Lint, Build Signed APK/AAB & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    outputs:
      release_tag: ${{ steps.version_meta.outputs.release_tag }}
      version_name: ${{ steps.version_meta.outputs.version_name }}
      version_code: ${{ steps.version_meta.outputs.version_code }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Resolve Monotonic Version Metadata Across Channels
        id: version_meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            RAW_TAG="${{ inputs.release_tag }}"
          else
            RAW_TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          CLEAN_VERSION="${RAW_TAG#v}"
          # Monotonically increasing versionCode across GitHub Releases and Google Play tracks
          MONOTONIC_CODE=$(( 100 + ${GITHUB_RUN_NUMBER:-1} ))
          echo "release_tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${MONOTONIC_CODE}" >> "$GITHUB_OUTPUT"

      - name: Ensure Gradle Wrapper is Executable
        run: chmod +x gradlew

      - name: Execute Unit & Robolectric Tests
        env:
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Execute Android Lint Verification
        env:
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Build Debug APK (AGP Default Debug Signing)
        env:
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./gradlew :app:assembleDebug --no-daemon
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::assembleDebug failed to produce app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

      - name: Notice for Untrusted Pull Requests (No Release Signing Secrets Exposed)
        if: github.event_name == 'pull_request'
        run: |
          echo "============================================================"
          echo "  Pull Request Verification Complete (Tests, Lint & Debug APK Passed)"
          echo "  Note: GitHub Actions does not expose release signing secrets"
          echo "  (UPLOAD_KEY_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)"
          echo "  to pull_request runs. Release APK/AAB signing is skipped on PRs."
          echo "============================================================"

      - name: Decode & Verify Original Upload Keystore from UPLOAD_KEY_BASE64
        id: load_keystore
        if: github.event_name != 'pull_request'
        env:
          UPLOAD_KEY_BASE64: ${{ secrets.UPLOAD_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_KEYSTORE_BYTES: ${{ vars.EXPECTED_KEYSTORE_BYTES || '2830' }}
          EXPECTED_KEYSTORE_FILE_SHA256: ${{ vars.EXPECTED_KEYSTORE_FILE_SHA256 }}
        run: |
          set +x
          # 1. Verify all 4 required signing secrets are present
          CLEAN_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n\t ')
          CLEAN_STORE_PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')

          MISSING_SECRETS=""
          [ -z "$UPLOAD_KEY_BASE64" ] && MISSING_SECRETS="${MISSING_SECRETS} UPLOAD_KEY_BASE64"
          [ -z "$CLEAN_STORE_PASS" ] && MISSING_SECRETS="${MISSING_SECRETS} KEYSTORE_PASSWORD"
          [ -z "$CLEAN_ALIAS" ] && MISSING_SECRETS="${MISSING_SECRETS} KEY_ALIAS"
          [ -z "$CLEAN_KEY_PASS" ] && MISSING_SECRETS="${MISSING_SECRETS} KEY_PASSWORD"

          if [ -n "$MISSING_SECRETS" ]; then
            echo "::error::Missing required repository signing secret(s):${MISSING_SECRETS}. Refusing to generate or substitute another certificate."
            exit 1
          fi

          # 2. Strict single-pass Base64 normalization and integrity verification
          RAW_CHAR_LEN=${#UPLOAD_KEY_BASE64}
          NORM_B64=$(printf '%s' "$UPLOAD_KEY_BASE64" | sed -E '/^-----BEGIN /d; /^-----END /d' | tr -d '\r\n\t ')
          NORM_CHAR_LEN=${#NORM_B64}

          if [ -z "$NORM_B64" ]; then
            echo "::error::Base64 decoding failure: UPLOAD_KEY_BASE64 is empty after removing whitespace."
            exit 1
          fi

          # Reject any characters outside the standard Base64 alphabet
          if ! printf '%s' "$NORM_B64" | grep -Eq '^[A-Za-z0-9+/]+={0,2}$'; then
            echo "::error::Base64 decoding failure: UPLOAD_KEY_BASE64 contains invalid non-Base64 characters (raw length=${RAW_CHAR_LEN}, normalized length=${NORM_CHAR_LEN})."
            exit 1
          fi

          UNPADDED_B64=$(printf '%s' "$NORM_B64" | sed 's/=*$//')
          UNPADDED_LEN=${#UNPADDED_B64}
          PADDING_LEN=$(( NORM_CHAR_LEN - UNPADDED_LEN ))
          REM=$(( UNPADDED_LEN % 4 ))

          if [ "$REM" -eq 1 ]; then
            echo "::error::Base64 decoding failure: Invalid Base64 length (${NORM_CHAR_LEN} chars, unpadded=${UNPADDED_LEN}, remainder=1 mod 4). The secret in UPLOAD_KEY_BASE64 is truncated or damaged."
            exit 1
          elif [ "$REM" -eq 2 ] && [ "$PADDING_LEN" -eq 0 ]; then
            echo "::warning::UPLOAD_KEY_BASE64 has unpadded length ${UNPADDED_LEN} (remainder 2 mod 4 without trailing '=='). Appending '==' for decoding and checking binary structure for truncation..."
            NORM_B64="${UNPADDED_B64}=="
          elif [ "$REM" -eq 3 ] && [ "$PADDING_LEN" -eq 0 ]; then
            echo "::warning::UPLOAD_KEY_BASE64 has unpadded length ${UNPADDED_LEN} (remainder 3 mod 4 without trailing '='). Appending '=' for decoding and checking binary structure for truncation..."
            NORM_B64="${UNPADDED_B64}="
          else
            # Ensure canonical padding matches unpadded length modulo 4
            if [ "$REM" -eq 0 ]; then
              NORM_B64="$UNPADDED_B64"
            elif [ "$REM" -eq 2 ]; then
              NORM_B64="${UNPADDED_B64}=="
            elif [ "$REM" -eq 3 ]; then
              NORM_B64="${UNPADDED_B64}="
            fi
          fi

          KEYSTORE_FILE="${GITHUB_WORKSPACE}/pulseplay-release.jks"
          DECODE_LOG="${GITHUB_WORKSPACE}/base64_decode_err.log"
          rm -f "$KEYSTORE_FILE" "$DECODE_LOG"

          echo "Decoding pulseplay-release.jks from UPLOAD_KEY_BASE64 (raw secret chars=${RAW_CHAR_LEN}, normalized Base64 chars=${#NORM_B64}, unpadded chars=${UNPADDED_LEN})..."
          if ! printf '%s' "$NORM_B64" | base64 --decode > "$KEYSTORE_FILE" 2> "$DECODE_LOG"; then
            DECODE_ERR=$(cat "$DECODE_LOG" 2>/dev/null | tr '\n' ' ')
            echo "::error::Base64 decoding failure: GNU base64 failed to decode UPLOAD_KEY_BASE64 (${DECODE_ERR:-invalid Base64 input})."
            rm -f "$DECODE_LOG"
            exit 1
          fi
          rm -f "$DECODE_LOG"

          if [ ! -f "$KEYSTORE_FILE" ] || [ ! -r "$KEYSTORE_FILE" ] || [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Base64 decoding failure: Decoded keystore file ($KEYSTORE_FILE) is missing, unreadable, or empty (0 bytes)."
            exit 1
          fi

          # 3. Safe diagnostics: Decoded File Size, SHA-256 Checksum & Binary Header Inspection
          FILE_BYTES=$(stat -c%s "$KEYSTORE_FILE")
          FILE_SHA256=$(sha256sum "$KEYSTORE_FILE" | awk '{print $1}')
          MAGIC_HEX=$(head -c 4 "$KEYSTORE_FILE" | od -An -tx1 | tr -d ' \n' | tr '[:upper:]' '[:lower:]')

          echo "============================================================"
          echo "  Keystore File Integrity & Comparison Diagnostics"
          echo "============================================================"
          echo "  Decoded Runner Keystore Path:    $KEYSTORE_FILE"
          echo "  Decoded Runner Keystore Size:    ${FILE_BYTES} bytes"
          echo "  Decoded Runner Keystore SHA-256: ${FILE_SHA256}"
          echo "  Decoded Binary Header (4 bytes): 0x${MAGIC_HEX}"
          echo "------------------------------------------------------------"
          echo "  To compare against your original local keystore on Termux/Linux, run:"
          echo "    stat -c%s pulseplay-release.jks"
          echo "    sha256sum pulseplay-release.jks"
          echo "  Both size and SHA-256 must match the Decoded Runner values above byte-for-byte."
          echo "============================================================"

          if [ -n "$EXPECTED_KEYSTORE_BYTES" ] && [ "$FILE_BYTES" != "$EXPECTED_KEYSTORE_BYTES" ]; then
            echo "::error::Truncated or damaged keystore: Decoded keystore size (${FILE_BYTES} bytes) does not match EXPECTED_KEYSTORE_BYTES (${EXPECTED_KEYSTORE_BYTES} bytes)."
            exit 1
          fi

          if [ -n "$EXPECTED_KEYSTORE_FILE_SHA256" ]; then
            CLEAN_EXPECTED_FILE_SHA256=$(printf '%s' "$EXPECTED_KEYSTORE_FILE_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
            if [ "$FILE_SHA256" != "$CLEAN_EXPECTED_FILE_SHA256" ]; then
              echo "::error::Truncated or damaged keystore: Decoded keystore file SHA-256 (${FILE_SHA256}) does not match EXPECTED_KEYSTORE_FILE_SHA256 (${CLEAN_EXPECTED_FILE_SHA256})."
              exit 1
            fi
          fi

          # 4. Pre-keytool binary format & ASN.1 DER / JKS completeness check (never modifies file)
          export KEYSTORE_FILE
          python3 - << 'PYEOF'
          import os, sys, struct

          ks_path = os.environ["KEYSTORE_FILE"]
          data = open(ks_path, "rb").read()
          size = len(data)
          header_hex = data[:4].hex() if size >= 4 else data.hex()

          if size < 4:
              print(f"::error::Truncated or damaged keystore: Decoded file is only {size} bytes (header=0x{header_hex}).")
              sys.exit(1)

          # Case A: ASN.1 DER SEQUENCE header (0x30) — standard PKCS#12 keystore (default for keytool even with .jks extension)
          if data[0] == 0x30:
              b1 = data[1]
              if b1 < 0x80:
                  hdr_len = 2
                  declared_content_len = b1
              elif b1 == 0x80:
                  hdr_len = 2
                  declared_content_len = size - 2
              else:
                  num_len_bytes = b1 & 0x7F
                  if num_len_bytes < 1 or num_len_bytes > 4 or size < 2 + num_len_bytes:
                      print(f"::error::Invalid keystore format: Malformed ASN.1 length header (0x{header_hex}) in decoded file ({size} bytes).")
                      sys.exit(1)
                  hdr_len = 2 + num_len_bytes
                  declared_content_len = int.from_bytes(data[2:2 + num_len_bytes], "big")

              declared_total = hdr_len + declared_content_len
              print(f"Detected ASN.1 DER (PKCS#12) binary structure: header=0x{header_hex}, header_bytes={hdr_len}, declared_content_bytes={declared_content_len}, declared_total_bytes={declared_total}, actual_file_bytes={size}.")

              if size < declared_total:
                  missing_bytes = declared_total - size
                  expected_b64_chars = ((declared_total + 2) // 3) * 4
                  actual_b64_chars = ((size + 2) // 3) * 4
                  print(
                      f"::error::Truncated or damaged keystore: ASN.1 header (0x{header_hex}) declares a total keystore size of {declared_total} bytes "
                      f"({hdr_len}-byte header + {declared_content_len}-byte payload), but the decoded file is only {size} bytes "
                      f"({missing_bytes} bytes missing!). In Base64, {declared_total} bytes requires {expected_b64_chars} characters, "
                      f"whereas {size} bytes is only ~{actual_b64_chars} characters (missing ~{expected_b64_chars - actual_b64_chars} Base64 characters at the end). "
                      f"Please re-encode the complete original pulseplay-release.jks on Termux using 'base64 -w 0 pulseplay-release.jks' and update the UPLOAD_KEY_BASE64 GitHub Secret."
                  )
                  sys.exit(1)
              elif size > declared_total:
                  extra_bytes = size - declared_total
                  print(
                      f"::error::Truncated or damaged keystore: ASN.1 header (0x{header_hex}) declares {declared_total} total bytes, "
                      f"but decoded file has {size} bytes ({extra_bytes} unexpected trailing bytes)."
                  )
                  sys.exit(1)

          # Case B: Sun JKS magic header (0xFEEDFEED)
          elif data[:4] == b"\xfe\xed\xfe\xed":
              if size < 32:
                  print(f"::error::Truncated or damaged keystore: JKS header (0xfeedfeed) detected, but file is only {size} bytes (minimum JKS header + SHA-1 integrity trailer is 32 bytes).")
                  sys.exit(1)
              magic, version, count = struct.unpack(">III", data[:12])
              print(f"Detected binary JKS structure: header=0x{header_hex}, version={version}, entry_count={count}, actual_file_bytes={size}.")
              pos = 12
              try:
                  for _ in range(count):
                      tag = struct.unpack(">I", data[pos:pos+4])[0]
                      pos += 4
                      alias_len = struct.unpack(">H", data[pos:pos+2])[0]
                      pos += 2 + alias_len + 8
                      if tag == 1:
                          key_len = struct.unpack(">I", data[pos:pos+4])[0]
                          pos += 4 + key_len
                          cert_count = struct.unpack(">I", data[pos:pos+4])[0]
                          pos += 4
                          for _ in range(cert_count):
                              if version == 2:
                                  ctype_len = struct.unpack(">H", data[pos:pos+2])[0]
                                  pos += 2 + ctype_len
                              clen = struct.unpack(">I", data[pos:pos+4])[0]
                              pos += 4 + clen
                      elif tag == 2:
                          if version == 2:
                              ctype_len = struct.unpack(">H", data[pos:pos+2])[0]
                              pos += 2 + ctype_len
                          clen = struct.unpack(">I", data[pos:pos+4])[0]
                          pos += 4 + clen
                      else:
                          print(f"::error::Invalid keystore format: Unknown JKS entry tag ({tag}) at byte offset {pos - 4}.")
                          sys.exit(1)
              except struct.error:
                  print(f"::error::Truncated or damaged keystore: JKS entry structure truncated before reaching end of entries (file size={size} bytes, header=0x{header_hex}).")
                  sys.exit(1)

              trailer_len = size - pos
              if trailer_len < 20:
                  print(
                      f"::error::Truncated or damaged keystore: JKS entries end at byte {pos}, leaving only {trailer_len} bytes for the mandatory 20-byte SHA-1 integrity digest "
                      f"(expected total size={pos + 20} bytes, actual={size} bytes, missing {20 - trailer_len} bytes). "
                      f"Please re-encode the complete original pulseplay-release.jks with 'base64 -w 0 pulseplay-release.jks' and update UPLOAD_KEY_BASE64."
                  )
                  sys.exit(1)
          else:
              print(
                  f"::error::Invalid keystore format: Decoded file (size={size} bytes, header=0x{header_hex}) does not start with a valid JKS (0xfeedfeed) or PKCS12/ASN.1 (0x30...) magic header."
              )
              sys.exit(1)
          PYEOF

          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
          echo "keystore_loaded=true" >> "$GITHUB_OUTPUT"

      - name: Validate Keystore, Alias pulseplay & Certificate SHA-256
        id: validate_keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          # 1. Verify keystore file exists, is readable, and is non-empty
          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -r "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Truncated or damaged keystore: Keystore file not found, unreadable, or empty at KEYSTORE_PATH ($KEYSTORE_PATH)."
            exit 1
          fi

          # Strip only CR/LF line endings from passwords to preserve all legitimate password characters
          CLEAN_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n\t ')
          CLEAN_STORE_PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          TRIMMED_STORE_PASS=$(printf '%s' "$CLEAN_STORE_PASS" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')
          TRIMMED_KEY_PASS=$(printf '%s' "$CLEAN_KEY_PASS" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          export CLEAN_STORE_PASS TRIMMED_STORE_PASS CLEAN_KEY_PASS TRIMMED_KEY_PASS

          if [ "$CLEAN_ALIAS" != "pulseplay" ]; then
            echo "::error::Missing alias: Configured KEY_ALIAS ('$CLEAN_ALIAS') does not match expected alias 'pulseplay'."
            exit 1
          fi

          MAGIC_HEX=$(head -c 4 "$KEYSTORE_PATH" | od -An -tx1 | tr -d ' \n' | tr '[:upper:]' '[:lower:]')
          FILE_BYTES=$(stat -c%s "$KEYSTORE_PATH")
          FILE_SHA256=$(sha256sum "$KEYSTORE_PATH" | awk '{print $1}')

          # 2. Explicitly detect actual keystore format (PKCS12 vs JKS) via keytool rather than assuming from .jks extension
          if [ "${MAGIC_HEX:0:2}" = "30" ]; then
            CANDIDATE_TYPES="PKCS12 JKS"
          elif [ "$MAGIC_HEX" = "feedfeed" ]; then
            CANDIDATE_TYPES="JKS PKCS12"
          else
            CANDIDATE_TYPES="PKCS12 JKS"
          fi

          DETECTED_STORE_TYPE=""
          KS_OUT=""
          for CANDIDATE_TYPE in $CANDIDATE_TYPES; do
            echo "Probing keystore integrity and store password with keytool (-storetype ${CANDIDATE_TYPE}, size=${FILE_BYTES} bytes, header=0x${MAGIC_HEX})..."
            if KS_OUT=$(keytool -list -storetype "$CANDIDATE_TYPE" -keystore "$KEYSTORE_PATH" -storepass:env CLEAN_STORE_PASS 2>&1); then
              DETECTED_STORE_TYPE="$CANDIDATE_TYPE"
              break
            elif [ "$TRIMMED_STORE_PASS" != "$CLEAN_STORE_PASS" ] && [ -n "$TRIMMED_STORE_PASS" ] && KS_OUT_TRIM=$(keytool -list -storetype "$CANDIDATE_TYPE" -keystore "$KEYSTORE_PATH" -storepass:env TRIMMED_STORE_PASS 2>&1); then
              CLEAN_STORE_PASS="$TRIMMED_STORE_PASS"
              export CLEAN_STORE_PASS
              KS_OUT="$KS_OUT_TRIM"
              DETECTED_STORE_TYPE="$CANDIDATE_TYPE"
              echo "::warning::KEYSTORE_PASSWORD contained leading/trailing whitespace; succeeded after trimming surrounding whitespace."
              break
            fi
          done

          if [ -z "$DETECTED_STORE_TYPE" ]; then
            SAFE_ERR=$(printf '%s\n' "$KS_OUT" | head -n 3 | tr '\n' ' ')
            if echo "$KS_OUT" | grep -qi -E "EOFException|Short read of DER length|Unexpected end|premature EOF|DerInputStream\.getLength|Sequence tag error|corrupted"; then
              echo "::error::Truncated or damaged keystore (size=${FILE_BYTES} bytes, sha256=${FILE_SHA256}, header=0x${MAGIC_HEX}): keytool hit unexpected end-of-file (${SAFE_ERR}). Re-encode the complete original pulseplay-release.jks with 'base64 -w 0 pulseplay-release.jks' and update UPLOAD_KEY_BASE64."
            elif echo "$KS_OUT" | grep -qi -E "password was incorrect|Password verification failed|Given final block not properly padded|Integrity check failed"; then
              echo "::error::Incorrect store password (KEYSTORE_PASSWORD): Store password verification failed for keystore (size=${FILE_BYTES} bytes, header=0x${MAGIC_HEX}): ${SAFE_ERR}"
            elif echo "$KS_OUT" | grep -qi -E "Invalid keystore format|Unrecognized keystore format|not a keystore|DerInputStream\.getLength.*too big"; then
              echo "::error::Invalid keystore format: Decoded file (size=${FILE_BYTES} bytes, header=0x${MAGIC_HEX}) is neither a valid PKCS12 nor JKS keystore (${SAFE_ERR})."
            else
              echo "::error::Keystore validation failed via keytool (size=${FILE_BYTES} bytes, sha256=${FILE_SHA256}, header=0x${MAGIC_HEX}): ${SAFE_ERR}"
            fi
            exit 1
          fi

          echo "Confirmed actual keystore format via keytool: ${DETECTED_STORE_TYPE} (size=${FILE_BYTES} bytes, sha256=${FILE_SHA256})"

          # 3. Verify alias "pulseplay" exists, is a PrivateKeyEntry, and uses a 2048-bit RSA key
          echo "Validating alias '${CLEAN_ALIAS}' in ${DETECTED_STORE_TYPE} keystore..."
          if ! CERT_INFO=$(keytool -list -v -storetype "$DETECTED_STORE_TYPE" -keystore "$KEYSTORE_PATH" -storepass:env CLEAN_STORE_PASS -alias "$CLEAN_ALIAS" 2>&1); then
            SAFE_ALIAS_ERR=$(printf '%s\n' "$CERT_INFO" | head -n 2 | tr '\n' ' ')
            echo "::error::Missing alias: Alias '${CLEAN_ALIAS}' does not exist or could not be read in pulseplay-release.jks (${SAFE_ALIAS_ERR})."
            exit 1
          fi

          if ! echo "$CERT_INFO" | grep -q "PrivateKeyEntry"; then
            ACTUAL_ENTRY_TYPE=$(echo "$CERT_INFO" | awk -F': ' '/Entry type:/ {print $2; exit}')
            echo "::error::Missing PrivateKeyEntry: Alias '${CLEAN_ALIAS}' exists but has entry type '${ACTUAL_ENTRY_TYPE:-unknown}' instead of PrivateKeyEntry."
            exit 1
          fi

          if ! echo "$CERT_INFO" | grep -qi -E "2048-bit RSA|RSA.*2048"; then
            ACTUAL_KEY_ALG=$(echo "$CERT_INFO" | awk -F': ' '/Subject Public Key Algorithm:/ {print $2; exit}')
            echo "::error::Incorrect RSA key size: Alias '${CLEAN_ALIAS}' has key algorithm '${ACTUAL_KEY_ALG:-unknown}', expected 2048-bit RSA key."
            exit 1
          fi

          # 4. Compare decoded certificate SHA-256 with the configured expected fingerprint
          ACTUAL_SHA256=$(echo "$CERT_INFO" | awk '/SHA256:/ {print $2; exit}' | tr '[:lower:]' '[:upper:]')
          if [ -z "$ACTUAL_SHA256" ]; then
            echo "::error::Certificate fingerprint mismatch: Failed to extract certificate SHA-256 fingerprint for alias '${CLEAN_ALIAS}'."
            exit 1
          fi

          if [ "$ACTUAL_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Certificate fingerprint mismatch: Expected SHA-256 '${EXPECTED_CERT_SHA256}', got '${ACTUAL_SHA256}'."
            exit 1
          fi

          # 5. Verify private key password (KEY_PASSWORD) through an actual signing test with jarsigner
          echo "Verifying private key password (KEY_PASSWORD) for alias '${CLEAN_ALIAS}' via jarsigner..."
          TEMP_JAR=$(mktemp /tmp/keypass_verify_XXXXXX.jar)
          jar cf "$TEMP_JAR" README.md
          if ! JARSIGNER_OUT=$(jarsigner -storetype "$DETECTED_STORE_TYPE" -keystore "$KEYSTORE_PATH" -storepass:env CLEAN_STORE_PASS -keypass:env CLEAN_KEY_PASS "$TEMP_JAR" "$CLEAN_ALIAS" 2>&1); then
            if [ "$TRIMMED_KEY_PASS" != "$CLEAN_KEY_PASS" ] && [ -n "$TRIMMED_KEY_PASS" ] && jarsigner -storetype "$DETECTED_STORE_TYPE" -keystore "$KEYSTORE_PATH" -storepass:env CLEAN_STORE_PASS -keypass:env TRIMMED_KEY_PASS "$TEMP_JAR" "$CLEAN_ALIAS" >/dev/null 2>&1; then
              CLEAN_KEY_PASS="$TRIMMED_KEY_PASS"
              export CLEAN_KEY_PASS
              echo "::warning::KEY_PASSWORD contained leading/trailing whitespace; succeeded after trimming surrounding whitespace."
            else
              rm -f "$TEMP_JAR"
              SAFE_JS_ERR=$(printf '%s\n' "$JARSIGNER_OUT" | head -n 3 | tr '\n' ' ')
              echo "::error::Incorrect private key password (KEY_PASSWORD): Failed to sign test archive using alias '${CLEAN_ALIAS}' (${SAFE_JS_ERR})."
              exit 1
            fi
          fi
          rm -f "$TEMP_JAR"

          echo "============================================================"
          echo "  Verified Release Keystore Certificate Summary"
          echo "============================================================"
          echo "Detected Keystore Format: ${DETECTED_STORE_TYPE}"
          echo "Keystore Binary Size:     ${FILE_BYTES} bytes"
          echo "Keystore File SHA-256:    ${FILE_SHA256}"
          echo "$CERT_INFO" | grep -E "Keystore type:|Alias name:|Entry type:|Owner:|Issuer:|Valid from:|SHA1:|SHA256:|Signature algorithm name:|Subject Public Key Algorithm:" || true
          echo "============================================================"
          echo "expected_sha256=${ACTUAL_SHA256}" >> "$GITHUB_OUTPUT"
          echo "detected_store_type=${DETECTED_STORE_TYPE}" >> "$GITHUB_OUTPUT"

      - name: Build Signed Release APK Using Verified Upload Keystore
        id: release_signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +x
          ./gradlew :app:assembleRelease --no-daemon
          if [ ! -f "app/build/outputs/apk/release/app-release.apk" ]; then
            echo "::error::assembleRelease failed to produce app/build/outputs/apk/release/app-release.apk"
            exit 1
          fi
          echo "signed_release_built=true" >> "$GITHUB_OUTPUT"

      - name: Build Signed Release AAB Using Verified Upload Keystore
        id: bundle_signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +x
          ./gradlew :app:bundleRelease --no-daemon
          if [ ! -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "::error::bundleRelease failed to produce app/build/outputs/bundle/release/app-release.aab"
            exit 1
          fi
          echo "signed_bundle_built=true" >> "$GITHUB_OUTPUT"

      - name: Prepare Release Assets & SHA-256 Checksums
        id: prepare_assets
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release-assets
          VER="${{ steps.version_meta.outputs.version_name }}"
          CODE="${{ steps.version_meta.outputs.version_code }}"
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/PulsePlay-v${VER}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-assets/PulsePlay-v${VER}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-assets/PulsePlay-v${VER}-vc${CODE}-release.aab"
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify Debug APK, Release APK & Release AAB Signing Certificates
        id: verify_apk_cert
        if: github.event_name != 'pull_request'
        env:
          FILE_MANAGER_APK_URL: ${{ inputs.file_manager_apk_url }}
        run: |
          set +x
          # 1. Dynamically resolve apksigner & aapt2 from Android SDK Build Tools on Ubuntu Runner
          resolve_build_tool() {
            local TOOL_NAME="$1"
            local FOUND_PATH=""
            if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
              FOUND_PATH=$(find "$ANDROID_HOME/build-tools" -name "$TOOL_NAME" -type f 2>/dev/null | sort -V | tail -n 1)
            fi
            if [ -z "$FOUND_PATH" ] && [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT/build-tools" ]; then
              FOUND_PATH=$(find "$ANDROID_SDK_ROOT/build-tools" -name "$TOOL_NAME" -type f 2>/dev/null | sort -V | tail -n 1)
            fi
            if [ -z "$FOUND_PATH" ]; then
              FOUND_PATH=$(find /usr/local/lib/android/sdk/build-tools /opt/android/sdk/build-tools -name "$TOOL_NAME" -type f 2>/dev/null | sort -V | tail -n 1)
            fi
            if [ -z "$FOUND_PATH" ] && command -v "$TOOL_NAME" >/dev/null 2>&1; then
              FOUND_PATH=$(command -v "$TOOL_NAME")
            fi
            printf '%s' "$FOUND_PATH"
          }

          APKSIGNER=$(resolve_build_tool "apksigner")
          AAPT2=$(resolve_build_tool "aapt2")

          # Ensure Android SDK Build Tools are installed if not yet present on runner
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
              echo "Installing Android SDK build-tools via sdkmanager..."
              yes | "$SDKMANAGER" "build-tools;35.0.0" >/dev/null 2>&1 || true
              APKSIGNER=$(resolve_build_tool "apksigner")
              AAPT2=$(resolve_build_tool "aapt2")
            fi
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::Android SDK apksigner not found in SDK Build Tools."
            exit 1
          fi

          echo "Resolved Android SDK apksigner: $APKSIGNER"
          [ -n "$AAPT2" ] && echo "Resolved Android SDK aapt2:     $AAPT2"

          # Helper to convert 64-char hex digest to uppercase colon-separated SHA-256
          format_colon_sha256() {
            local RAW_HEX
            RAW_HEX=$(printf '%s' "$1" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')
            if [ "${#RAW_HEX}" -eq 64 ]; then
              printf '%s' "$RAW_HEX" | sed 's/../&:/g; s/:$//'
            else
              printf '%s' "$1"
            fi
          }

          # Helper to extract Package ID from an APK via Android SDK aapt2
          extract_package_id() {
            local APK_PATH="$1"
            local DEFAULT_PKG="$2"
            local PKG=""
            if [ -n "$AAPT2" ] && [ -x "$AAPT2" ] && [ -f "$APK_PATH" ]; then
              PKG=$("$AAPT2" dump packagename "$APK_PATH" 2>/dev/null | tr -d '\r\n\t ')
            fi
            if [ -z "$PKG" ]; then
              PKG="$DEFAULT_PKG"
            fi
            printf '%s' "$PKG"
          }

          VER="${{ steps.version_meta.outputs.version_name }}"
          CODE="${{ steps.version_meta.outputs.version_code }}"
          DEBUG_APK="release-assets/PulsePlay-v${VER}-debug.apk"
          RELEASE_APK="release-assets/PulsePlay-v${VER}-release.apk"
          RELEASE_AAB="release-assets/PulsePlay-v${VER}-vc${CODE}-release.aab"
          EXPECTED_SHA256="${EXPECTED_CERT_SHA256}"
          EXPECTED_SHA256_HEX=$(printf '%s' "$EXPECTED_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')

          OVERALL_FAILURE=0

          # ------------------------------------------------------------------
          # 2. Verify Debug APK (Standard Android Debug Certificate allowed)
          # ------------------------------------------------------------------
          DEBUG_APK_NAME=$(basename "$DEBUG_APK")
          DEBUG_PKG_ID="com.akashkumarmmb.pulseplay"
          DEBUG_SIGNER_COLON="N/A"
          DEBUG_STATUS="FAIL"

          if [ -f "$DEBUG_APK" ]; then
            DEBUG_PKG_ID=$(extract_package_id "$DEBUG_APK" "com.akashkumarmmb.pulseplay")
            DEBUG_FILESIZE=$(stat -c%s "$DEBUG_APK")
            echo "============================================================"
            echo "  Verifying Debug APK Signature: $DEBUG_APK_NAME ($DEBUG_FILESIZE bytes)"
            echo "  Package ID: $DEBUG_PKG_ID"
            echo "------------------------------------------------------------"
            if DEBUG_CERT_OUT=$("$APKSIGNER" verify --print-certs -v "$DEBUG_APK" 2>&1); then
              echo "$DEBUG_CERT_OUT"
              DEBUG_RAW_HEX=$(printf '%s\n' "$DEBUG_CERT_OUT" | awk '/certificate SHA-256 digest:/ {print $NF; exit}')
              DEBUG_SIGNER_COLON=$(format_colon_sha256 "$DEBUG_RAW_HEX")
              DEBUG_STATUS="PASS"
            else
              echo "$DEBUG_CERT_OUT"
              echo "::error::Debug APK signature verification failed for $DEBUG_APK_NAME."
              OVERALL_FAILURE=1
            fi
            echo "============================================================"
          else
            echo "::error::Expected Debug APK $DEBUG_APK not found for signature verification."
            OVERALL_FAILURE=1
          fi

          # ------------------------------------------------------------------
          # 3. Verify Release APK against Official Music Player Upload Certificate
          # ------------------------------------------------------------------
          RELEASE_APK_NAME=$(basename "$RELEASE_APK")
          RELEASE_PKG_ID="com.akashkumarmmb.pulseplay"
          RELEASE_SIGNER_COLON="N/A"
          RELEASE_APK_STATUS="FAIL"

          if [ -f "$RELEASE_APK" ]; then
            RELEASE_PKG_ID=$(extract_package_id "$RELEASE_APK" "com.akashkumarmmb.pulseplay")
            RELEASE_FILESIZE=$(stat -c%s "$RELEASE_APK")
            echo "============================================================"
            echo "  Verifying Release APK Signature: $RELEASE_APK_NAME ($RELEASE_FILESIZE bytes)"
            echo "  Package ID: $RELEASE_PKG_ID"
            echo "------------------------------------------------------------"
            if RELEASE_CERT_OUT=$("$APKSIGNER" verify --print-certs -v "$RELEASE_APK" 2>&1); then
              echo "$RELEASE_CERT_OUT"
              RELEASE_CERT_SHA256=$(printf '%s\n' "$RELEASE_CERT_OUT" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]')
              RELEASE_SIGNER_COLON=$(format_colon_sha256 "$RELEASE_CERT_SHA256")
              echo "Release APK Signer SHA-256:   $RELEASE_SIGNER_COLON"
              echo "Expected Upload Key SHA-256:  $EXPECTED_SHA256"
              if [ -n "$RELEASE_CERT_SHA256" ] && [ "$RELEASE_CERT_SHA256" = "$EXPECTED_SHA256_HEX" ]; then
                RELEASE_APK_STATUS="PASS"
              else
                echo "::error::APK signing certificate mismatch: Release APK certificate ($RELEASE_SIGNER_COLON) does not match expected upload certificate ($EXPECTED_SHA256)."
                RELEASE_APK_STATUS="FAIL"
                OVERALL_FAILURE=1
              fi
            else
              echo "$RELEASE_CERT_OUT"
              echo "::error::apksigner verification failed for Release APK $RELEASE_APK_NAME."
              RELEASE_APK_STATUS="FAIL"
              OVERALL_FAILURE=1
            fi
            echo "============================================================"
          else
            echo "::error::Expected Release APK $RELEASE_APK not found for signature verification."
            OVERALL_FAILURE=1
          fi

          # ------------------------------------------------------------------
          # 4. Verify Release AAB against Official Music Player Upload Certificate
          # ------------------------------------------------------------------
          RELEASE_AAB_NAME=$(basename "$RELEASE_AAB")
          AAB_SHA256="N/A"
          RELEASE_AAB_STATUS="FAIL"

          if [ -f "$RELEASE_AAB" ]; then
            AAB_FILESIZE=$(stat -c%s "$RELEASE_AAB")
            if jarsigner -verify -verbose -certs "$RELEASE_AAB" >/dev/null 2>&1; then
              AAB_CERT_INFO=$(keytool -printcert -jarfile "$RELEASE_AAB" 2>/dev/null)
              AAB_SHA256=$(printf '%s\n' "$AAB_CERT_INFO" | awk '/SHA256:/ {print $2; exit}' | tr '[:lower:]' '[:upper:]')
              AAB_SHA256_HEX=$(printf '%s' "$AAB_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
              echo "============================================================"
              echo "  Verifying Release AAB Signature: $RELEASE_AAB_NAME ($AAB_FILESIZE bytes)"
              echo "  AAB Certificate SHA-256: $AAB_SHA256"
              echo "  Expected Upload SHA-256: $EXPECTED_SHA256"
              echo "============================================================"
              if [ -n "$AAB_SHA256_HEX" ] && [ "$AAB_SHA256_HEX" = "$EXPECTED_SHA256_HEX" ]; then
                RELEASE_AAB_STATUS="PASS"
              else
                echo "::error::APK signing certificate mismatch: Release AAB certificate ($AAB_SHA256) does not match expected upload certificate ($EXPECTED_SHA256)."
                RELEASE_AAB_STATUS="FAIL"
                OVERALL_FAILURE=1
              fi
            else
              echo "::error::jarsigner verification failed for $RELEASE_AAB_NAME."
              RELEASE_AAB_STATUS="FAIL"
              OVERALL_FAILURE=1
            fi
          else
            echo "::error::Expected Release AAB $RELEASE_AAB not found for signature verification."
            OVERALL_FAILURE=1
          fi

          # ------------------------------------------------------------------
          # 5. Informational File Manager APK Certificate Check (Non-Blocking)
          # ------------------------------------------------------------------
          FM_APK_PATH=""
          if [ -n "$FILE_MANAGER_APK_URL" ]; then
            echo "Downloading File Manager APK from provided URL for informational certificate comparison..."
            if curl -fsSL -L "$FILE_MANAGER_APK_URL" -o "/tmp/FileManager-compare.apk" 2>/dev/null && [ -s "/tmp/FileManager-compare.apk" ]; then
              FM_APK_PATH="/tmp/FileManager-compare.apk"
            else
              echo "::warning::Could not download File Manager APK from URL ($FILE_MANAGER_APK_URL). Continuing without failing Music Player workflow."
            fi
          fi

          if [ -z "$FM_APK_PATH" ]; then
            FM_APK_PATH=$(find "${GITHUB_WORKSPACE}" -maxdepth 3 -type f \( -iname "*file*manager*.apk" -o -iname "*filemanager*.apk" \) 2>/dev/null | head -n 1)
          fi

          FM_FOUND="false"
          FM_FILENAME="Not provided in this run"
          FM_PKG_ID="Separate File Manager App Package"
          FM_SIGNER_SHA256="N/A (Provide file_manager_apk_url or place FileManager.apk in workspace to inspect)"
          FM_COMPARISON_RESULT="INFO ONLY (Not Provided)"

          if [ -n "$FM_APK_PATH" ] && [ -f "$FM_APK_PATH" ]; then
            FM_FOUND="true"
            FM_FILENAME=$(basename "$FM_APK_PATH")
            FM_PKG_ID=$(extract_package_id "$FM_APK_PATH" "unknown.filemanager.package")
            if FM_CERT_OUT=$("$APKSIGNER" verify --print-certs "$FM_APK_PATH" 2>&1); then
              FM_RAW_HEX=$(printf '%s\n' "$FM_CERT_OUT" | awk '/certificate SHA-256 digest:/ {print $NF; exit}')
              FM_SIGNER_SHA256=$(format_colon_sha256 "$FM_RAW_HEX")
              if [ "$FM_SIGNER_SHA256" = "$EXPECTED_SHA256" ]; then
                FM_COMPARISON_RESULT="SAME CERTIFICATE AS MUSIC PLAYER UPLOAD KEY"
              else
                FM_COMPARISON_RESULT="DIFFERENT CERTIFICATE FROM MUSIC PLAYER UPLOAD KEY (Expected for independent keystore)"
              fi
            else
              FM_SIGNER_SHA256="Invalid or Unsigned APK"
              FM_COMPARISON_RESULT="UNVERIFIED APK SIGNATURE (Informational)"
            fi
            echo "============================================================"
            echo "  File Manager APK Certificate Comparison (Informational Only)"
            echo "  APK Filename:            $FM_FILENAME"
            echo "  Package ID:              $FM_PKG_ID"
            echo "  File Manager SHA-256:    $FM_SIGNER_SHA256"
            echo "  Music Player SHA-256:    $EXPECTED_SHA256"
            echo "  Comparison Result:       $FM_COMPARISON_RESULT"
            echo "============================================================"
            rm -f "/tmp/FileManager-compare.apk"
          fi

          # ------------------------------------------------------------------
          # 6. Write Structured Verification Report to $GITHUB_STEP_SUMMARY
          # ------------------------------------------------------------------
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "## 🔐 Android APK & AAB Signing Certificate Verification Report"
              echo ""
              echo "- **Android SDK Build Tools \`apksigner\`**: \`${APKSIGNER}\`"
              echo "- **PulsePlay Official Release Alias**: \`pulseplay\`"
              echo "- **Expected Release Certificate SHA-256**: \`${EXPECTED_SHA256}\`"
              echo "- **AAB Signing Verification Status**: **${RELEASE_AAB_STATUS}** (\`${RELEASE_AAB_NAME}\`)"
              echo ""
              echo "### 🎵 PulsePlay Build Variants (\`com.akashkumarmmb.pulseplay\`)"
              echo ""
              echo "| APK / Bundle Filename | Package ID | Build Type | Signer SHA-256 | Expected SHA-256 | Verification |"
              echo "| :--- | :--- | :--- | :--- | :--- | :---: |"
              echo "| \`${DEBUG_APK_NAME}\` | \`${DEBUG_PKG_ID}\` | Debug APK (AGP Default Debug Key) | \`${DEBUG_SIGNER_COLON}\` | Standard Android Debug Cert (Allowed to differ from Release) | **${DEBUG_STATUS}** |"
              echo "| \`${RELEASE_APK_NAME}\` | \`${RELEASE_PKG_ID}\` | Release APK (\`alias: pulseplay\`) | \`${RELEASE_SIGNER_COLON}\` | \`${EXPECTED_SHA256}\` | **${RELEASE_APK_STATUS}** |"
              echo "| \`${RELEASE_AAB_NAME}\` | \`${RELEASE_PKG_ID}\` | Release AAB (\`alias: pulseplay\`) | \`${AAB_SHA256}\` | \`${EXPECTED_SHA256}\` | **${RELEASE_AAB_STATUS}** |"
              echo ""
              echo "### 📁 File Manager APK Certificate Comparison (Informational — Non-Blocking)"
              echo ""
              echo "| APK Filename | Package ID | File Manager Signer SHA-256 | PulsePlay Release SHA-256 | Certificate Comparison |"
              echo "| :--- | :--- | :--- | :--- | :--- |"
              echo "| \`${FM_FILENAME}\` | \`${FM_PKG_ID}\` | \`${FM_SIGNER_SHA256}\` | \`${EXPECTED_SHA256}\` | **${FM_COMPARISON_RESULT}** |"
              echo ""
              echo "> **Note:** Debug APK uses Android Gradle Plugin's standard debug certificate, whereas Release APK and Release AAB strictly require the verified PulsePlay release certificate (\`${EXPECTED_SHA256}\`). File Manager APK comparison is purely informational and never blocks the PulsePlay build."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$OVERALL_FAILURE" -ne 0 ]; then
            echo "::error::Signing certificate verification failed! Check the GitHub Actions Step Summary for full details."
            exit 1
          fi

          echo "Signing verification passed: Debug APK is valid debug-signed; Release APK and Release AAB match the official release certificate ($EXPECTED_SHA256)."


      - name: Upload Build Artifacts (Workflow Run)
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pulseplay-apk-artifacts-v${{ steps.version_meta.outputs.version_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Upload Diagnostic Test & Lint Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pulseplay-failure-diagnostics-${{ github.run_number }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Publish GitHub Release
        if: >
          success() &&
          github.event_name != 'pull_request' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.create_github_release != false))
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version_meta.outputs.release_tag }}
          name: "PulsePlay ${{ steps.version_meta.outputs.release_tag }}"
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ### PulsePlay ${{ steps.version_meta.outputs.release_tag }}
            - **versionName**: `${{ steps.version_meta.outputs.version_name }}`
            - **versionCode**: `${{ steps.version_meta.outputs.version_code }}`
            - **Release Signing Certificate SHA-256**: `${{ steps.validate_keystore.outputs.expected_sha256 }}`
            - `PulsePlay-v${{ steps.version_meta.outputs.version_name }}-release.apk` and `PulsePlay-v${{ steps.version_meta.outputs.version_name }}-vc${{ steps.version_meta.outputs.version_code }}-release.aab` are signed with the verified PulsePlay release keystore (`alias: pulseplay`).
            - `PulsePlay-v${{ steps.version_meta.outputs.version_name }}-debug.apk` uses standard Android debug signing.
            - Verify downloaded assets against `SHA256SUMS.txt` or via the in-app **Settings → App Updates** updater.
          files: |
            release-assets/*

      - name: Clean Up Decoded Upload Keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/pulseplay-release.jks" "${GITHUB_WORKSPACE}/my-upload-key.jks"

  google-play-bundle:
    name: Google Play Store Bundle & Track Deployment (Manual / Guarded)
    needs: build-verify-and-release
    if: >
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.build_play_bundle == true || inputs.publish_to_play_store == true)))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode & Verify Original Upload Keystore from UPLOAD_KEY_BASE64
        id: load_play_keystore
        env:
          UPLOAD_KEY_BASE64: ${{ secrets.UPLOAD_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EXPECTED_KEYSTORE_BYTES: ${{ vars.EXPECTED_KEYSTORE_BYTES || '2830' }}
          EXPECTED_KEYSTORE_FILE_SHA256: ${{ vars.EXPECTED_KEYSTORE_FILE_SHA256 }}
        run: |
          set +x
          # 1. Verify all 4 required signing secrets are present
          CLEAN_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n\t ')
          CLEAN_STORE_PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')

          MISSING_SECRETS=""
          [ -z "$UPLOAD_KEY_BASE64" ] && MISSING_SECRETS="${MISSING_SECRETS} UPLOAD_KEY_BASE64"
          [ -z "$CLEAN_STORE_PASS" ] && MISSING_SECRETS="${MISSING_SECRETS} KEYSTORE_PASSWORD"
          [ -z "$CLEAN_ALIAS" ] && MISSING_SECRETS="${MISSING_SECRETS} KEY_ALIAS"
          [ -z "$CLEAN_KEY_PASS" ] && MISSING_SECRETS="${MISSING_SECRETS} KEY_PASSWORD"

          if [ -n "$MISSING_SECRETS" ]; then
            echo "::error::Google Play App Bundles require repository signing secrets:${MISSING_SECRETS}. Refusing to generate or substitute another certificate."
            exit 1
          fi

          # 2. Strict single-pass Base64 normalization and integrity verification
          RAW_CHAR_LEN=${#UPLOAD_KEY_BASE64}
          NORM_B64=$(printf '%s' "$UPLOAD_KEY_BASE64" | sed -E '/^-----BEGIN /d; /^-----END /d' | tr -d '\r\n\t ')
          NORM_CHAR_LEN=${#NORM_B64}

          if [ -z "$NORM_B64" ]; then
            echo "::error::Base64 decoding failure: UPLOAD_KEY_BASE64 is empty after removing whitespace."
            exit 1
          fi

          if ! printf '%s' "$NORM_B64" | grep -Eq '^[A-Za-z0-9+/]+={0,2}$'; then
            echo "::error::Base64 decoding failure: UPLOAD_KEY_BASE64 contains invalid non-Base64 characters (raw length=${RAW_CHAR_LEN}, normalized length=${NORM_CHAR_LEN})."
            exit 1
          fi

          UNPADDED_B64=$(printf '%s' "$NORM_B64" | sed 's/=*$//')
          UNPADDED_LEN=${#UNPADDED_B64}
          PADDING_LEN=$(( NORM_CHAR_LEN - UNPADDED_LEN ))
          REM=$(( UNPADDED_LEN % 4 ))

          if [ "$REM" -eq 1 ]; then
            echo "::error::Base64 decoding failure: Invalid Base64 length (${NORM_CHAR_LEN} chars, unpadded=${UNPADDED_LEN}, remainder=1 mod 4). The secret in UPLOAD_KEY_BASE64 is truncated or damaged."
            exit 1
          elif [ "$REM" -eq 2 ] && [ "$PADDING_LEN" -eq 0 ]; then
            echo "::warning::UPLOAD_KEY_BASE64 has unpadded length ${UNPADDED_LEN} (remainder 2 mod 4 without trailing '=='). Appending '==' for decoding and checking binary structure for truncation..."
            NORM_B64="${UNPADDED_B64}=="
          elif [ "$REM" -eq 3 ] && [ "$PADDING_LEN" -eq 0 ]; then
            echo "::warning::UPLOAD_KEY_BASE64 has unpadded length ${UNPADDED_LEN} (remainder 3 mod 4 without trailing '='). Appending '=' for decoding and checking binary structure for truncation..."
            NORM_B64="${UNPADDED_B64}="
          else
            if [ "$REM" -eq 0 ]; then
              NORM_B64="$UNPADDED_B64"
            elif [ "$REM" -eq 2 ]; then
              NORM_B64="${UNPADDED_B64}=="
            elif [ "$REM" -eq 3 ]; then
              NORM_B64="${UNPADDED_B64}="
            fi
          fi

          KEYSTORE_FILE="${GITHUB_WORKSPACE}/pulseplay-release.jks"
          DECODE_LOG="${GITHUB_WORKSPACE}/play_base64_decode_err.log"
          rm -f "$KEYSTORE_FILE" "$DECODE_LOG"

          echo "Decoding pulseplay-release.jks from UPLOAD_KEY_BASE64 for Google Play bundle (raw secret chars=${RAW_CHAR_LEN}, normalized Base64 chars=${#NORM_B64}, unpadded chars=${UNPADDED_LEN})..."
          if ! printf '%s' "$NORM_B64" | base64 --decode > "$KEYSTORE_FILE" 2> "$DECODE_LOG"; then
            DECODE_ERR=$(cat "$DECODE_LOG" 2>/dev/null | tr '\n' ' ')
            echo "::error::Base64 decoding failure: GNU base64 failed to decode UPLOAD_KEY_BASE64 (${DECODE_ERR:-invalid Base64 input})."
            rm -f "$DECODE_LOG"
            exit 1
          fi
          rm -f "$DECODE_LOG"

          if [ ! -f "$KEYSTORE_FILE" ] || [ ! -r "$KEYSTORE_FILE" ] || [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Base64 decoding failure: Decoded keystore file ($KEYSTORE_FILE) is missing, unreadable, or empty (0 bytes)."
            exit 1
          fi

          FILE_BYTES=$(stat -c%s "$KEYSTORE_FILE")
          FILE_SHA256=$(sha256sum "$KEYSTORE_FILE" | awk '{print $1}')
          MAGIC_HEX=$(head -c 4 "$KEYSTORE_FILE" | od -An -tx1 | tr -d ' \n' | tr '[:upper:]' '[:lower:]')

          echo "============================================================"
          echo "  Keystore File Integrity & Comparison Diagnostics (Play Bundle)"
          echo "============================================================"
          echo "  Decoded Runner Keystore Path:    $KEYSTORE_FILE"
          echo "  Decoded Runner Keystore Size:    ${FILE_BYTES} bytes"
          echo "  Decoded Runner Keystore SHA-256: ${FILE_SHA256}"
          echo "  Decoded Binary Header (4 bytes): 0x${MAGIC_HEX}"
          echo "============================================================"

          if [ -n "$EXPECTED_KEYSTORE_BYTES" ] && [ "$FILE_BYTES" != "$EXPECTED_KEYSTORE_BYTES" ]; then
            echo "::error::Truncated or damaged keystore: Decoded keystore size (${FILE_BYTES} bytes) does not match EXPECTED_KEYSTORE_BYTES (${EXPECTED_KEYSTORE_BYTES} bytes)."
            exit 1
          fi

          if [ -n "$EXPECTED_KEYSTORE_FILE_SHA256" ]; then
            CLEAN_EXPECTED_FILE_SHA256=$(printf '%s' "$EXPECTED_KEYSTORE_FILE_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
            if [ "$FILE_SHA256" != "$CLEAN_EXPECTED_FILE_SHA256" ]; then
              echo "::error::Truncated or damaged keystore: Decoded keystore file SHA-256 (${FILE_SHA256}) does not match EXPECTED_KEYSTORE_FILE_SHA256 (${CLEAN_EXPECTED_FILE_SHA256})."
              exit 1
            fi
          fi

          export KEYSTORE_FILE
          python3 - << 'PYEOF'
          import os, sys, struct

          ks_path = os.environ["KEYSTORE_FILE"]
          data = open(ks_path, "rb").read()
          size = len(data)
          header_hex = data[:4].hex() if size >= 4 else data.hex()

          if size < 4:
              print(f"::error::Truncated or damaged keystore: Decoded file is only {size} bytes (header=0x{header_hex}).")
              sys.exit(1)

          if data[0] == 0x30:
              b1 = data[1]
              if b1 < 0x80:
                  hdr_len = 2
                  declared_content_len = b1
              elif b1 == 0x80:
                  hdr_len = 2
                  declared_content_len = size - 2
              else:
                  num_len_bytes = b1 & 0x7F
                  if num_len_bytes < 1 or num_len_bytes > 4 or size < 2 + num_len_bytes:
                      print(f"::error::Invalid keystore format: Malformed ASN.1 length header (0x{header_hex}) in decoded file ({size} bytes).")
                      sys.exit(1)
                  hdr_len = 2 + num_len_bytes
                  declared_content_len = int.from_bytes(data[2:2 + num_len_bytes], "big")

              declared_total = hdr_len + declared_content_len
              print(f"Detected ASN.1 DER (PKCS#12) binary structure: header=0x{header_hex}, header_bytes={hdr_len}, declared_content_bytes={declared_content_len}, declared_total_bytes={declared_total}, actual_file_bytes={size}.")

              if size < declared_total:
                  missing_bytes = declared_total - size
                  expected_b64_chars = ((declared_total + 2) // 3) * 4
                  actual_b64_chars = ((size + 2) // 3) * 4
                  print(
                      f"::error::Truncated or damaged keystore: ASN.1 header (0x{header_hex}) declares a total keystore size of {declared_total} bytes "
                      f"({hdr_len}-byte header + {declared_content_len}-byte payload), but the decoded file is only {size} bytes "
                      f"({missing_bytes} bytes missing!). In Base64, {declared_total} bytes requires {expected_b64_chars} characters, "
                      f"whereas {size} bytes is only ~{actual_b64_chars} characters (missing ~{expected_b64_chars - actual_b64_chars} Base64 characters at the end). "
                      f"Please re-encode the complete original pulseplay-release.jks on Termux using 'base64 -w 0 pulseplay-release.jks' and update the UPLOAD_KEY_BASE64 GitHub Secret."
                  )
                  sys.exit(1)
              elif size > declared_total:
                  extra_bytes = size - declared_total
                  print(
                      f"::error::Truncated or damaged keystore: ASN.1 header (0x{header_hex}) declares {declared_total} total bytes, "
                      f"but decoded file has {size} bytes ({extra_bytes} unexpected trailing bytes)."
                  )
                  sys.exit(1)

          elif data[:4] == b"\xfe\xed\xfe\xed":
              if size < 32:
                  print(f"::error::Truncated or damaged keystore: JKS header (0xfeedfeed) detected, but file is only {size} bytes.")
                  sys.exit(1)
              magic, version, count = struct.unpack(">III", data[:12])
              pos = 12
              try:
                  for _ in range(count):
                      tag = struct.unpack(">I", data[pos:pos+4])[0]
                      pos += 4
                      alias_len = struct.unpack(">H", data[pos:pos+2])[0]
                      pos += 2 + alias_len + 8
                      if tag == 1:
                          key_len = struct.unpack(">I", data[pos:pos+4])[0]
                          pos += 4 + key_len
                          cert_count = struct.unpack(">I", data[pos:pos+4])[0]
                          pos += 4
                          for _ in range(cert_count):
                              if version == 2:
                                  ctype_len = struct.unpack(">H", data[pos:pos+2])[0]
                                  pos += 2 + ctype_len
                              clen = struct.unpack(">I", data[pos:pos+4])[0]
                              pos += 4 + clen
                      elif tag == 2:
                          if version == 2:
                              ctype_len = struct.unpack(">H", data[pos:pos+2])[0]
                              pos += 2 + ctype_len
                          clen = struct.unpack(">I", data[pos:pos+4])[0]
                          pos += 4 + clen
                      else:
                          print(f"::error::Invalid keystore format: Unknown JKS entry tag ({tag}) at byte offset {pos - 4}.")
                          sys.exit(1)
              except struct.error:
                  print(f"::error::Truncated or damaged keystore: JKS entry structure truncated before reaching end of entries (file size={size} bytes, header=0x{header_hex}).")
                  sys.exit(1)

              trailer_len = size - pos
              if trailer_len < 20:
                  print(
                      f"::error::Truncated or damaged keystore: JKS entries end at byte {pos}, leaving only {trailer_len} bytes for the mandatory 20-byte SHA-1 integrity digest "
                      f"(expected total size={pos + 20} bytes, actual={size} bytes, missing {20 - trailer_len} bytes)."
                  )
                  sys.exit(1)
          else:
              print(
                  f"::error::Invalid keystore format: Decoded file (size={size} bytes, header=0x{header_hex}) does not start with a valid JKS (0xfeedfeed) or PKCS12/ASN.1 (0x30...) magic header."
              )
              sys.exit(1)
          PYEOF

          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
          echo "keystore_loaded=true" >> "$GITHUB_OUTPUT"

      - name: Validate Keystore, Alias pulseplay & Certificate SHA-256
        id: validate_play_keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +x
          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -r "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Truncated or damaged keystore: Keystore file not found, unreadable, or empty at KEYSTORE_PATH ($KEYSTORE_PATH)."
            exit 1
          fi

          CLEAN_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n\t ')
          CLEAN_STORE_PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          TRIMMED_STORE_PASS=$(printf '%s' "$CLEAN_STORE_PASS" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          CLEAN_KEY_PASS=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')
          TRIMMED_KEY_PASS=$(printf '%s' "$CLEAN_KEY_PASS" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')

          export CLEAN_STORE_PASS TRIMMED_STORE_PASS CLEAN_KEY_PASS TRIMMED_KEY_PASS

          if [ "$CLEAN_ALIAS" != "pulseplay" ]; then
            echo "::error::Missing alias: Configured KEY_ALIAS ('$CLEAN_ALIAS') does not match expected alias 'pulseplay'."
            exit 1
          fi

          MAGIC_HEX=$(head -c 4 "$KEYSTORE_PATH" | od -An -tx1 | tr -d ' \n' | tr '[:upper:]' '[:lower:]')
          FILE_BYTES=$(stat -c%s "$KEYSTORE_PATH")
          FILE_SHA256=$(sha256sum "$KEYSTORE_PATH" | awk '{print $1}')

          if [ "${MAGIC_HEX:0:2}" = "30" ]; then
            CANDIDATE_TYPES="PKCS12 JKS"
          elif [ "$MAGIC_HEX" = "feedfeed" ]; then
            CANDIDATE_TYPES="JKS PKCS12"
          else
            CANDIDATE_TYPES="PKCS12 JKS"
          fi

          DETECTED_STORE_TYPE=""
          KS_OUT=""
          for CANDIDATE_TYPE in $CANDIDATE_TYPES; do
            echo "Probing keystore integrity and store password with keytool (-storetype ${CANDIDATE_TYPE}, size=${FILE_BYTES} bytes, header=0x${MAGIC_HEX})..."
            if KS_OUT=$(keytool -list -storetype "$CANDIDATE_TYPE" -keystore "$KEYSTORE_PATH" -storepass:env CLEAN_STORE_PASS 2>&1); then
              DETECTED_STORE_TYPE="$CANDIDATE_TYPE"
              break
            elif [ "$TRIMMED_STORE_PASS" != "$CLEAN_STORE_PASS" ] && [ -n "$TRIMMED_STORE_PASS" ] && KS_OUT_TRIM=$(keytool -list -storetype "$CANDIDATE_TYPE" -keystore "$KEYSTORE_PATH" -storepass:env TRIMMED_STORE_PASS 2>&1); then
              CLEAN_STORE_PASS="$TRIMMED_STORE_PASS"
              export CLEAN_STORE_PASS
              KS_OUT="$KS_OUT_TRIM"
              DETECTED_STORE_TYPE="$CANDIDATE_TYPE"
              echo "::warning::KEYSTORE_PASSWORD contained leading/trailing whitespace; succeeded after trimming surrounding whitespace."
              break
            fi
          done

          if [ -z "$DETECTED_STORE_TYPE" ]; then
            SAFE_ERR=$(printf '%s\n' "$KS_OUT" | head -n 3 | tr '\n' ' ')
            if echo "$KS_OUT" | grep -qi -E "EOFException|Short read of DER length|Unexpected end|premature EOF|DerInputStream\.getLength|Sequence tag error|corrupted"; then
              echo "::error::Truncated or damaged keystore (size=${FILE_BYTES} bytes, sha256=${FILE_SHA256}, header=0x${MAGIC_HEX}): keytool hit unexpected end-of-file (${SAFE_ERR}). Re-encode the complete original pulseplay-release.jks with 'base64 -w 0 pulseplay-release.jks' and update UPLOAD_KEY_BASE64."
            elif echo "$KS_OUT" | grep -qi -E "password was incorrect|Password verification failed|Given final block not properly padded|Integrity check failed"; then
              echo "::error::Incorrect store password (KEYSTORE_PASSWORD): Store password verification failed for keystore (size=${FILE_BYTES} bytes, header=0x${MAGIC_HEX}): ${SAFE_ERR}"
            elif echo "$KS_OUT" | grep -qi -E "Invalid keystore format|Unrecognized keystore format|not a keystore|DerInputStream\.getLength.*too big"; then
              echo "::error::Invalid keystore format: Decoded file (size=${FILE_BYTES} bytes, header=0x${MAGIC_HEX}) is neither a valid PKCS12 nor JKS keystore (${SAFE_ERR})."
            else
              echo "::error::Keystore validation failed via keytool (size=${FILE_BYTES} bytes, sha256=${FILE_SHA256}, header=0x${MAGIC_HEX}): ${SAFE_ERR}"
            fi
            exit 1
          fi

          echo "Confirmed actual keystore format via keytool: ${DETECTED_STORE_TYPE} (size=${FILE_BYTES} bytes, sha256=${FILE_SHA256})"

          echo "Validating alias '${CLEAN_ALIAS}' in ${DETECTED_STORE_TYPE} keystore..."
          if ! CERT_INFO=$(keytool -list -v -storetype "$DETECTED_STORE_TYPE" -keystore "$KEYSTORE_PATH" -storepass:env CLEAN_STORE_PASS -alias "$CLEAN_ALIAS" 2>&1); then
            SAFE_ALIAS_ERR=$(printf '%s\n' "$CERT_INFO" | head -n 2 | tr '\n' ' ')
            echo "::error::Missing alias: Alias '${CLEAN_ALIAS}' does not exist or could not be read in pulseplay-release.jks (${SAFE_ALIAS_ERR})."
            exit 1
          fi

          if ! echo "$CERT_INFO" | grep -q "PrivateKeyEntry"; then
            ACTUAL_ENTRY_TYPE=$(echo "$CERT_INFO" | awk -F': ' '/Entry type:/ {print $2; exit}')
            echo "::error::Missing PrivateKeyEntry: Alias '${CLEAN_ALIAS}' exists but has entry type '${ACTUAL_ENTRY_TYPE:-unknown}' instead of PrivateKeyEntry."
            exit 1
          fi

          if ! echo "$CERT_INFO" | grep -qi -E "2048-bit RSA|RSA.*2048"; then
            ACTUAL_KEY_ALG=$(echo "$CERT_INFO" | awk -F': ' '/Subject Public Key Algorithm:/ {print $2; exit}')
            echo "::error::Incorrect RSA key size: Alias '${CLEAN_ALIAS}' has key algorithm '${ACTUAL_KEY_ALG:-unknown}', expected 2048-bit RSA key."
            exit 1
          fi

          ACTUAL_SHA256=$(echo "$CERT_INFO" | awk '/SHA256:/ {print $2; exit}' | tr '[:lower:]' '[:upper:]')
          if [ -z "$ACTUAL_SHA256" ]; then
            echo "::error::Certificate fingerprint mismatch: Failed to extract certificate SHA-256 fingerprint for alias '${CLEAN_ALIAS}'."
            exit 1
          fi

          if [ "$ACTUAL_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Certificate fingerprint mismatch: Expected SHA-256 '${EXPECTED_CERT_SHA256}', got '${ACTUAL_SHA256}'."
            exit 1
          fi

          echo "Verifying private key password (KEY_PASSWORD) for alias '${CLEAN_ALIAS}' via jarsigner..."
          TEMP_JAR=$(mktemp /tmp/keypass_play_verify_XXXXXX.jar)
          jar cf "$TEMP_JAR" README.md
          if ! JARSIGNER_OUT=$(jarsigner -storetype "$DETECTED_STORE_TYPE" -keystore "$KEYSTORE_PATH" -storepass:env CLEAN_STORE_PASS -keypass:env CLEAN_KEY_PASS "$TEMP_JAR" "$CLEAN_ALIAS" 2>&1); then
            if [ "$TRIMMED_KEY_PASS" != "$CLEAN_KEY_PASS" ] && [ -n "$TRIMMED_KEY_PASS" ] && jarsigner -storetype "$DETECTED_STORE_TYPE" -keystore "$KEYSTORE_PATH" -storepass:env CLEAN_STORE_PASS -keypass:env TRIMMED_KEY_PASS "$TEMP_JAR" "$CLEAN_ALIAS" >/dev/null 2>&1; then
              CLEAN_KEY_PASS="$TRIMMED_KEY_PASS"
              export CLEAN_KEY_PASS
              echo "::warning::KEY_PASSWORD contained leading/trailing whitespace; succeeded after trimming surrounding whitespace."
            else
              rm -f "$TEMP_JAR"
              SAFE_JS_ERR=$(printf '%s\n' "$JARSIGNER_OUT" | head -n 3 | tr '\n' ' ')
              echo "::error::Incorrect private key password (KEY_PASSWORD): Failed to sign test archive using alias '${CLEAN_ALIAS}' (${SAFE_JS_ERR})."
              exit 1
            fi
          fi
          rm -f "$TEMP_JAR"

          echo "============================================================"
          echo "  Verified Release Keystore Certificate Summary"
          echo "============================================================"
          echo "Detected Keystore Format: ${DETECTED_STORE_TYPE}"
          echo "Keystore Binary Size:     ${FILE_BYTES} bytes"
          echo "Keystore File SHA-256:    ${FILE_SHA256}"
          echo "$CERT_INFO" | grep -E "Keystore type:|Alias name:|Entry type:|Owner:|Issuer:|Valid from:|SHA1:|SHA256:|Signature algorithm name:|Subject Public Key Algorithm:" || true
          echo "============================================================"
          echo "expected_sha256=${ACTUAL_SHA256}" >> "$GITHUB_OUTPUT"
          echo "detected_store_type=${DETECTED_STORE_TYPE}" >> "$GITHUB_OUTPUT"

      - name: Ensure Gradle Wrapper is Executable
        run: chmod +x gradlew

      - name: Build Signed Google Play Release Bundle (:app:bundleRelease)
        id: build_aab
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ needs.build-verify-and-release.outputs.version_name }}
          APP_VERSION_CODE: ${{ needs.build-verify-and-release.outputs.version_code }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +x
          ./gradlew :app:bundleRelease --no-daemon

          if [ ! -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "::error::bundleRelease completed but app/build/outputs/bundle/release/app-release.aab was not generated."
            exit 1
          fi

          mkdir -p play-bundle-artifacts
          VER="${{ needs.build-verify-and-release.outputs.version_name }}"
          CODE="${{ needs.build-verify-and-release.outputs.version_code }}"
          cp app/build/outputs/bundle/release/app-release.aab "play-bundle-artifacts/PulsePlay-v${VER}-vc${CODE}-release.aab"
          cd play-bundle-artifacts
          sha256sum * > SHA256SUMS-AAB.txt

      - name: Verify Google Play AAB Signing Certificate
        id: verify_aab_cert
        run: |
          VER="${{ needs.build-verify-and-release.outputs.version_name }}"
          CODE="${{ needs.build-verify-and-release.outputs.version_code }}"
          AAB_FILE="play-bundle-artifacts/PulsePlay-v${VER}-vc${CODE}-release.aab"
          EXPECTED_SHA256="${EXPECTED_CERT_SHA256}"
          EXPECTED_SHA256_HEX=$(echo "$EXPECTED_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')

          if [ ! -f "$AAB_FILE" ]; then
            echo "::error::Signed AAB $AAB_FILE not found for verification."
            exit 1
          fi

          if ! jarsigner -verify -verbose -certs "$AAB_FILE" >/dev/null 2>&1; then
            echo "::error::jarsigner verification failed for $AAB_FILE."
            exit 1
          fi

          AAB_CERT_INFO=$(keytool -printcert -jarfile "$AAB_FILE" 2>/dev/null)
          AAB_SHA256=$(echo "$AAB_CERT_INFO" | awk '/SHA256:/ {print $2; exit}' | tr '[:lower:]' '[:upper:]')
          AAB_SHA256_HEX=$(echo "$AAB_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          AAB_FILESIZE=$(stat -c%s "$AAB_FILE")

          echo "============================================================"
          echo "  Google Play AAB Signing Certificate Verification"
          echo "============================================================"
          echo "AAB Filename:            $(basename "$AAB_FILE")"
          echo "AAB File Size:           $AAB_FILESIZE bytes"
          echo "AAB Certificate SHA-256: $AAB_SHA256"
          echo "Expected Release SHA-256: $EXPECTED_SHA256"
          echo "============================================================"

          AAB_STATUS="PASS"
          if [ -z "$AAB_SHA256_HEX" ] || [ "$AAB_SHA256_HEX" != "$EXPECTED_SHA256_HEX" ]; then
            AAB_STATUS="FAIL"
          fi

          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "## 📦 Google Play Store AAB Signing Certificate Verification"
              echo ""
              echo "| Bundle Filename | Package ID | Signer SHA-256 | Expected SHA-256 | Verification |"
              echo "| :--- | :--- | :--- | :--- | :---: |"
              echo "| \`$(basename "$AAB_FILE")\` | \`com.akashkumarmmb.pulseplay\` | \`${AAB_SHA256}\` | \`${EXPECTED_SHA256}\` | **${AAB_STATUS}** |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$AAB_STATUS" != "PASS" ]; then
            echo "::error::AAB certificate SHA-256 ($AAB_SHA256) does not match verified release keystore SHA-256 ($EXPECTED_SHA256)."
            exit 1
          fi

          echo "Google Play AAB signing certificate verified: $EXPECTED_SHA256"

      - name: Upload Signed Google Play AAB Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pulseplay-play-store-aab-v${{ needs.build-verify-and-release.outputs.version_name }}
          path: play-bundle-artifacts/*
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Verify Play Console Credentials Before Upload
        id: play_credentials
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_play_store == true
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set +x
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is not configured yet. Skipping Play Console upload; signed AAB artifact has been archived for manual Play Console upload."
            echo "can_upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "can_upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Signed AAB to Google Play Track (${{ inputs.play_track }})
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_play_store == true && steps.play_credentials.outputs.can_upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.akashkumarmmb.pulseplay
          releaseFiles: play-bundle-artifacts/*.aab
          track: ${{ inputs.play_track }}
          status: completed

      - name: Clean Up Decoded Upload Keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/pulseplay-release.jks" "${GITHUB_WORKSPACE}/my-upload-key.jks"
