name: Android CI & GitHub Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_github_release:
        description: "Publish a GitHub Release with APK & SHA-256 checksums"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release version tag (e.g., v1.0.0) when triggered manually"
        required: false
        default: "v1.0.0"
        type: string
      prerelease:
        description: "Mark release as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verify-and-release:
    name: Test, Build APK & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Debug Keystore Exists for Reproducible Debug Signing
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure Gradle Wrapper is Executable
        run: chmod +x gradlew

      - name: Execute Unit & Robolectric Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble Installable Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Assemble Signed Release APK & AAB (If Release Secrets Configured)
        id: release_signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            export KEYSTORE_PATH="${GITHUB_WORKSPACE}/my-upload-key.jks"
            ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
            echo "signed_release_built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release keystore secrets not configured; packaging verified installable Debug APK."
            echo "signed_release_built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Release Assets & SHA-256 Checksums
        id: prepare_assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/PulsePlay-debug.apk
          if [ "${{ steps.release_signing.outputs.signed_release_built }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk release-assets/PulsePlay-release.apk
            cp app/build/outputs/bundle/release/app-release.aab release-assets/PulsePlay-release.aab
          fi
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Upload Build Artifacts (Workflow Run)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pulseplay-apk-artifacts
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Publish GitHub Release
        if: >
          success() &&
          (startsWith(github.ref, 'refs/tags/v') ||
           (github.event_name == 'workflow_dispatch' && inputs.create_github_release == true))
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          name: "PulsePlay ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}"
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-assets/*

      - name: Clean Up Temporary Release Keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"
